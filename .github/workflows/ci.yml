# CI (RA §2 공통 도구, §8-4 규칙 9·17)
# - 백엔드: WP 디렉터리별 테스트 잡(tests/<모듈>) + ruff + mypy --strict
# - 프론트: lint / typecheck / test
# - contracts/** 또는 공통(core·models·pyproject·CI) 이 바뀌면 전체를 돌린다. 수동 실행·주간 예약 실행도 전체.
# - D32(2026-10-19, Actions 무료 2,000분 소진): main push 도 PR 처럼 바뀐 모듈만 돌린다. 작은 백엔드 모듈 6개는 한 잡,
#   Lighthouse 는 프론트가 바뀔 때·주간 예약·수동만, 회귀는 코드가 바뀌면 항상. 매주 월 09:00(KST) 전체 실행이 안전망.
name: ci

on:
  push:
    branches: [main, "wp/**"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 1"  # 매주 월 00:00 UTC(09:00 KST) — 전체 실행(D32 안전망)

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      contracts: ${{ steps.filter.outputs.contracts }}
      shared: ${{ steps.filter.outputs.shared }}
      core: ${{ steps.filter.outputs.core }}
      collectors: ${{ steps.filter.outputs.collectors }}
      normalize: ${{ steps.filter.outputs.normalize }}
      judge: ${{ steps.filter.outputs.judge }}
      analysis: ${{ steps.filter.outputs.analysis }}
      api: ${{ steps.filter.outputs.api }}
      scheduler: ${{ steps.filter.outputs.scheduler }}
      reports: ${{ steps.filter.outputs.reports }}
      fixtures_contract: ${{ steps.filter.outputs.fixtures_contract }}
      frontend: ${{ steps.filter.outputs.frontend }}
      infra: ${{ steps.filter.outputs.infra }}
      regress: ${{ steps.filter.outputs.regress }}
      backend: ${{ steps.filter.outputs.backend }}
      full: ${{ steps.plan.outputs.full }}
      code: ${{ steps.plan.outputs.code }}
      backend_matrix: ${{ steps.plan.outputs.backend_matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            contracts:
              - 'contracts/**'
            shared:
              - 'backend/app/core/**'
              - 'backend/app/models/**'
              - 'backend/app/main.py'
              - 'backend/app/worker.py'
              - 'backend/pyproject.toml'
              - 'backend/uv.lock'
              - 'backend/tests/conftest.py'
              - '.github/workflows/**'
            core:
              - 'backend/tests/core/**'
              - 'infra/**'
              - 'scripts/**'
              - 'Makefile'
              - 'docs/**'
              - '.pre-commit-config.yaml'
            collectors:
              - 'backend/app/collectors/**'
              - 'backend/tests/collectors/**'
            normalize:
              - 'backend/app/normalize/**'
              - 'backend/tests/normalize/**'
            judge:
              - 'backend/app/judge/**'
              - 'backend/tests/judge/**'
            analysis:
              - 'backend/app/analysis/**'
              - 'backend/tests/analysis/**'
            api:
              - 'backend/app/api/**'
              - 'backend/tests/api/**'
            scheduler:
              - 'backend/app/scheduler/**'
              - 'backend/tests/scheduler/**'
            reports:
              - 'backend/app/reports/**'
              - 'backend/tests/reports/**'
            fixtures_contract:
              - 'contracts/fixtures/**'
              - 'backend/tests/fixtures_contract/**'
            frontend:
              - 'frontend/**'
            infra:
              - 'infra/**'
            regress:
              - 'backend/tests/regress/**'
              - 'e2e/**'
              - 'scripts/tasks.py'
            backend:
              - 'backend/**'
            contracts_tests:
              - 'backend/tests/contracts/**'
              - 'backend/scripts/**'
      # D32: 무엇을 돌릴지 한곳에서 정한다 — full(수동·예약·contracts/공통), 백엔드 테스트 행렬(바뀐 모듈만, 작은 모듈 6개는
      # 한 잡 'small'), code(문서·infra 만 바뀐 게 아니면 true → 회귀)
      - name: plan
        id: plan
        env:
          FULL: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || steps.filter.outputs.contracts == 'true' || steps.filter.outputs.shared == 'true' }}
          OUT: ${{ toJSON(steps.filter.outputs) }}
        run: |
          hit() { [ "$FULL" = "true" ] || [ "$(jq -r --arg k "$1" '.[$k] // "false"' <<<"$OUT")" = "true" ]; }
          small=""
          for m in core contracts analysis judge normalize fixtures_contract; do
            key=$m; [ "$m" = contracts ] && key=contracts_tests
            if hit "$key"; then small="$small tests/$m"; fi
          done
          items='[]'
          if [ -n "$small" ]; then items=$(jq -c --arg p "${small# }" '. + [{"name":"small","paths":$p}]' <<<"$items"); fi
          for m in collectors api scheduler reports; do
            if hit "$m"; then items=$(jq -c --arg m "$m" '. + [{"name":$m,"paths":("tests/"+$m)}]' <<<"$items"); fi
          done
          code=false
          for k in backend frontend regress fixtures_contract contracts shared; do if hit "$k"; then code=true; fi; done
          { echo "full=$FULL"; echo "code=$code"; echo "backend_matrix=$items"; } >> "$GITHUB_OUTPUT"
          echo "full=$FULL code=$code backend=$items"

  backend-lint:
    needs: changes
    if: needs.changes.outputs.full == 'true' || needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --all-extras --frozen
      - name: ruff
        run: uv run ruff check app tests
      - name: mypy (strict)
        run: uv run mypy app
      - name: contract generated files are fresh (bundle + pydantic)
        run: uv run python scripts/gen_contracts.py --check

  backend-tests:
    needs: changes
    if: needs.changes.outputs.backend_matrix != '[]'
    name: backend-tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # D32: changes 잡이 정한 행렬 {name, paths}. small = core·contracts·analysis·judge·normalize·fixtures_contract 중
        # 바뀐 것(한 잡), 나머지는 모듈마다 한 잡. tests/regress 는 regress 잡.
        include: ${{ fromJSON(needs.changes.outputs.backend_matrix) }}
    defaults:
      run:
        working-directory: backend
    # D25-8: Postgres 테스트(tests/contracts 의 마이그레이션 왕복 등)는 서비스 컨테이너로 돈다 — 리눅스 러너에서 pgserver
    # 내장 서버는 유닉스 소켓 경로 문제로 실패했다(run 38326346203). 로컬은 TEST_POSTGRES_URL 이 없으면 pgserver 그대로.
    # 일회용 CI DB 라 비밀번호 없이 trust 인증(저장소 비밀값을 쓰지 않는다).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: contracts_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d contracts_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_PATHS: ${{ matrix.paths }}
      JUDGE_ADAPTER: mock
      TEST_POSTGRES_URL: postgresql+psycopg://postgres@localhost:5432/contracts_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --all-extras --frozen
      # 보고서 PDF(D4)·공식 홈페이지 렌더(수집)는 Playwright chromium 이 필요하다(R3 minor 2)
      - if: matrix.name == 'reports' || matrix.name == 'collectors'
        name: playwright install chromium
        run: uv run playwright install --with-deps chromium
      # 보고서 HTML 의 ECharts 인라인(tests/reports/test_html.py)은 frontend/node_modules/echarts 번들을 쓴다 —
      # 없으면 CI 에서는 skip 이 아니라 실패한다(R5-OPS 6). frontend lock 그대로 설치.
      - if: matrix.name == 'reports'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - if: matrix.name == 'reports'
        name: npm ci (frontend — echarts 번들)
        working-directory: frontend
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: pytest ${{ matrix.paths }}
        run: |
          set +e
          uv run pytest $TEST_PATHS
          code=$?
          # 5 = 수집된 테스트 0개
          if [ "$code" -eq 5 ]; then echo "$TEST_PATHS: 테스트 0개"; exit 0; fi
          exit $code

  infra:
    needs: changes
    if: needs.changes.outputs.full == 'true' || needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker compose config
        run: |
          cp infra/.env.example infra/.env
          # API_TOKEN 이 비면 compose 가 거부해야 한다(R3 M11)
          if docker compose -f infra/docker-compose.yml config -q 2>/dev/null; then
            echo "API_TOKEN 없이 compose config 가 통과했다"; exit 1
          fi
          echo "API_TOKEN=ci-$(openssl rand -hex 16)" >> infra/.env
          docker compose -f infra/docker-compose.yml config -q
          bash -n infra/backup.sh infra/raw_archive.sh

  frontend:
    needs: changes
    if: needs.changes.outputs.full == 'true' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: decide
        id: decide
        working-directory: .
        env:
          RUN: "true"
        run: |
          if [ ! -f frontend/package.json ]; then echo "run=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "run=$RUN" >> "$GITHUB_OUTPUT"
      - if: steps.decide.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - if: steps.decide.outputs.run == 'true'
        run: npm ci
      - if: steps.decide.outputs.run == 'true'
        name: lint
        run: npm run lint
      - if: steps.decide.outputs.run == 'true'
        name: typecheck
        run: npm run typecheck
      - if: steps.decide.outputs.run == 'true'
        name: test
        run: npm test
      - if: steps.decide.outputs.run == 'true'
        name: build
        run: npm run build

  # R3 minor 2 · 재리뷰 m2: 프론트 e2e(MSW 스모크 + 화면 e2e). 차트 스크린샷 기준 이미지는 OS별
  # (Playwright 파일 이름 접미사 -chromium-<platform>.png): win32 는 개발 기기, linux 는 이 잡이 비교한다.
  # D25-9(R5): linux 기준 이미지는 run 38326346203 산출물(chart-snapshots-linux)을 커밋했다 — 이 잡은 비교만 한다
  # (--update-snapshots 없음). 차트를 일부러 바꿨으면 실패한 실행의 frontend-e2e 아티팩트(test-results/*-actual.png)를
  # 검토한 뒤 같은 이름의 -chromium-linux.png 로 커밋한다. 화면 e2e(e2e/pages)는 스크린샷이 없어 --ignore-snapshots 그대로.
  frontend-e2e:
    needs: changes
    if: needs.changes.outputs.full == 'true' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: playwright install chromium
        run: npx playwright install --with-deps chromium
      - name: e2e smoke (tests/e2e) + 차트 스냅샷 비교(linux 기준 이미지, D25-9)
        shell: bash
        run: |
          if ! compgen -G "tests/e2e/charts-gallery.spec.ts-snapshots/*-chromium-linux.png" > /dev/null; then
            echo "::error::linux 차트 기준 이미지가 없다(tests/e2e/charts-gallery.spec.ts-snapshots/*-chromium-linux.png)"; exit 1
          fi
          npx playwright test
      - name: e2e pages (e2e/pages, T16 프레임 측정 포함)
        run: npx playwright test -c e2e/pages --ignore-snapshots
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-e2e
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore

  # R3 M15: Lighthouse 80 이상(성능·접근성·권장 사항) — npm run lighthouse 가 점수 미달이면 exit 1
  # D32: 프론트가 바뀔 때·주간 예약·수동 실행만(contracts·공통 변경만으로는 돌리지 않는다)
  frontend-lighthouse:
    needs: changes
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: playwright install chromium (Lighthouse 용 Chrome)
        run: npx playwright install --with-deps chromium
      - name: npm run lighthouse
        run: npm run lighthouse

  # WP9 R3: 회귀(RA §9 T1~T18 통합 + e2e 흐름 3개). main push·수동·contracts/공통·회귀 관련 변경 때.
  # 실패해도 다른 잡과 독립 — 결과 요약은 로그 '회귀 요약' 절과 아티팩트(junit·Playwright json·trace).
  regress:
    needs: changes
    # D32: 코드(백엔드·프론트·e2e·contracts·공통·픽스처)가 바뀌면 항상 — 모듈만 돌리는 대신 모듈을 가로지르는 안전망
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      JUDGE_ADAPTER: mock
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - working-directory: backend
        run: |
          uv sync --all-extras --frozen
          uv run playwright install --with-deps chromium   # 보고서 PDF(D4)
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: python scripts/tasks.py regress
        run: python scripts/tasks.py regress
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regress-results
          path: |
            e2e/playwright-report/
            e2e/test-results/
          if-no-files-found: ignore

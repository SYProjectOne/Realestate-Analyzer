# CI (RA §2 공통 도구, §8-4 규칙 9·17)
# - 백엔드: WP 디렉터리별 테스트 잡(tests/<모듈>) + ruff + mypy --strict
# - 프론트: lint / typecheck / test
# - contracts/** 또는 공통(core·models·pyproject·CI) 이 바뀌면 전체를 돌린다. main push 도 전체.
name: ci

on:
  push:
    branches: [main, "wp/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      contracts: ${{ steps.filter.outputs.contracts }}
      shared: ${{ steps.filter.outputs.shared }}
      core: ${{ steps.filter.outputs.core }}
      models: ${{ steps.filter.outputs.models }}
      collectors: ${{ steps.filter.outputs.collectors }}
      normalize: ${{ steps.filter.outputs.normalize }}
      judge: ${{ steps.filter.outputs.judge }}
      analysis: ${{ steps.filter.outputs.analysis }}
      api: ${{ steps.filter.outputs.api }}
      scheduler: ${{ steps.filter.outputs.scheduler }}
      reports: ${{ steps.filter.outputs.reports }}
      fixtures_contract: ${{ steps.filter.outputs.fixtures_contract }}
      frontend: ${{ steps.filter.outputs.frontend }}
      infra: ${{ steps.filter.outputs.infra }}
      regress: ${{ steps.filter.outputs.regress }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            contracts:
              - 'contracts/**'
            shared:
              - 'backend/app/core/**'
              - 'backend/app/models/**'
              - 'backend/app/main.py'
              - 'backend/app/worker.py'
              - 'backend/pyproject.toml'
              - 'backend/uv.lock'
              - 'backend/tests/conftest.py'
              - '.github/workflows/**'
            core:
              - 'backend/tests/core/**'
              - 'infra/**'
              - 'scripts/**'
              - 'Makefile'
              - 'docs/**'
              - '.pre-commit-config.yaml'
            models:
              - 'backend/tests/models/**'
            collectors:
              - 'backend/app/collectors/**'
              - 'backend/tests/collectors/**'
            normalize:
              - 'backend/app/normalize/**'
              - 'backend/tests/normalize/**'
            judge:
              - 'backend/app/judge/**'
              - 'backend/tests/judge/**'
            analysis:
              - 'backend/app/analysis/**'
              - 'backend/tests/analysis/**'
            api:
              - 'backend/app/api/**'
              - 'backend/tests/api/**'
            scheduler:
              - 'backend/app/scheduler/**'
              - 'backend/tests/scheduler/**'
            reports:
              - 'backend/app/reports/**'
              - 'backend/tests/reports/**'
            fixtures_contract:
              - 'contracts/fixtures/**'
              - 'backend/tests/fixtures_contract/**'
            frontend:
              - 'frontend/**'
            infra:
              - 'infra/**'
            regress:
              - 'backend/tests/regress/**'
              - 'e2e/**'
              - 'scripts/tasks.py'

  backend-lint:
    needs: changes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --all-extras --frozen
      - name: ruff
        run: uv run ruff check app tests
      - name: mypy (strict)
        run: uv run mypy app
      - name: contract generated files are fresh (bundle + pydantic)
        run: uv run python scripts/gen_contracts.py --check

  backend-tests:
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [core, contracts, models, collectors, normalize, judge, analysis, api, scheduler, reports, fixtures_contract]
    defaults:
      run:
        working-directory: backend
    env:
      MODULE: ${{ matrix.module }}
      JUDGE_ADAPTER: mock
    steps:
      - uses: actions/checkout@v4
      - name: decide
        id: decide
        working-directory: .
        env:
          # 수동 실행·main push·contracts/공통 변경 → 전체, 아니면 바뀐 모듈만
          RUN: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || needs.changes.outputs.contracts == 'true' || needs.changes.outputs.shared == 'true' || needs.changes.outputs[matrix.module] == 'true' }}
        run: echo "run=$RUN" >> "$GITHUB_OUTPUT"
      - if: steps.decide.outputs.run == 'true'
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - if: steps.decide.outputs.run == 'true'
        run: uv sync --all-extras --frozen
      # 보고서 PDF(D4)·공식 홈페이지 렌더(수집)는 Playwright chromium 이 필요하다(R3 minor 2)
      - if: steps.decide.outputs.run == 'true' && (matrix.module == 'reports' || matrix.module == 'collectors')
        name: playwright install chromium
        run: uv run playwright install --with-deps chromium
      - name: pytest tests/${{ matrix.module }}
        if: steps.decide.outputs.run == 'true'
        run: |
          if [ ! -d "tests/$MODULE" ]; then
            echo "tests/$MODULE 없음 — 아직 구현 전"; exit 0
          fi
          set +e
          uv run pytest "tests/$MODULE"
          code=$?
          # 5 = 수집된 테스트 0개(뼈대만 있는 WP)
          if [ "$code" -eq 5 ]; then echo "tests/$MODULE: 테스트 0개"; exit 0; fi
          exit $code

  infra:
    needs: changes
    if: needs.changes.outputs.infra == 'true' || needs.changes.outputs.contracts == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker compose config
        run: |
          cp infra/.env.example infra/.env
          # API_TOKEN 이 비면 compose 가 거부해야 한다(R3 M11)
          if docker compose -f infra/docker-compose.yml config -q 2>/dev/null; then
            echo "API_TOKEN 없이 compose config 가 통과했다"; exit 1
          fi
          echo "API_TOKEN=ci-$(openssl rand -hex 16)" >> infra/.env
          docker compose -f infra/docker-compose.yml config -q
          bash -n infra/backup.sh infra/raw_archive.sh

  frontend:
    needs: changes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: decide
        id: decide
        working-directory: .
        env:
          RUN: ${{ github.event_name != 'pull_request' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.contracts == 'true' }}
        run: |
          if [ ! -f frontend/package.json ]; then echo "run=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "run=$RUN" >> "$GITHUB_OUTPUT"
      - if: steps.decide.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - if: steps.decide.outputs.run == 'true'
        run: npm ci
      - if: steps.decide.outputs.run == 'true'
        name: lint
        run: npm run lint
      - if: steps.decide.outputs.run == 'true'
        name: typecheck
        run: npm run typecheck
      - if: steps.decide.outputs.run == 'true'
        name: test
        run: npm test
      - if: steps.decide.outputs.run == 'true'
        name: build
        run: npm run build

  # R3 minor 2: 프론트 e2e(MSW 스모크 + 화면 e2e). 차트 스크린샷 기준 이미지는 win32 에서 만든 것이라
  # linux CI 에서는 비교를 끈다(--ignore-snapshots) — 스냅샷 비교는 개발 기기(win32)에서 npm run e2e 로.
  frontend-e2e:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: playwright install chromium
        run: npx playwright install --with-deps chromium
      - name: e2e smoke (tests/e2e)
        run: npx playwright test --ignore-snapshots
      - name: e2e pages (e2e/pages, T16 프레임 측정 포함)
        run: npx playwright test -c e2e/pages --ignore-snapshots
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-e2e
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore

  # R3 M15: Lighthouse 80 이상(성능·접근성·권장 사항) — npm run lighthouse 가 점수 미달이면 exit 1
  frontend-lighthouse:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: playwright install chromium (Lighthouse 용 Chrome)
        run: npx playwright install --with-deps chromium
      - name: npm run lighthouse
        run: npm run lighthouse

  # WP9 R3: 회귀(RA §9 T1~T18 통합 + e2e 흐름 3개). main push·수동·contracts/공통·회귀 관련 변경 때.
  # 실패해도 다른 잡과 독립 — 결과 요약은 로그 '회귀 요약' 절과 아티팩트(junit·Playwright json·trace).
  regress:
    needs: changes
    if: >-
      github.event_name != 'pull_request' || needs.changes.outputs.contracts == 'true' ||
      needs.changes.outputs.shared == 'true' || needs.changes.outputs.fixtures_contract == 'true' ||
      needs.changes.outputs.regress == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      JUDGE_ADAPTER: mock
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - working-directory: backend
        run: |
          uv sync --all-extras --frozen
          uv run playwright install --with-deps chromium   # 보고서 PDF(D4)
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: python scripts/tasks.py regress
        run: python scripts/tasks.py regress
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regress-results
          path: |
            e2e/playwright-report/
            e2e/test-results/
          if-no-files-found: ignore

# pre-commit (RA §2 공통 도구, AGENTS 규칙 9·10·17)
#   uv run --directory backend pre-commit install      # 한 번
#   uv run --directory backend pre-commit run --all-files
default_install_hook_types: [pre-commit]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=2048"]
      - id: detect-private-key
      - id: check-merge-conflict
      - id: check-yaml
        args: ["--allow-multiple-documents"]
      - id: check-toml
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: end-of-file-fixer
        exclude: ^contracts/fixtures/

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # ruff·mypy 는 backend/uv.lock 에 고정된 버전을 쓴다(CI 와 같은 결과)
  - repo: local
    hooks:
      - id: ruff
        name: ruff (backend)
        entry: uv run --directory backend ruff check --fix app tests
        language: system
        pass_filenames: false
        files: ^backend/.*\.py$
      - id: mypy
        name: mypy --strict (backend)
        entry: uv run --directory backend mypy app
        language: system
        pass_filenames: false
        files: ^backend/.*\.py$
      - id: eslint
        name: eslint (frontend)
        entry: npm --prefix frontend run lint
        language: system
        pass_filenames: false
        files: ^frontend/.*\.(ts|tsx|js|jsx)$
      - id: no-dotenv
        name: .env 커밋 금지 (.env.example 만)
        entry: ".env 파일은 커밋하지 않는다 — infra/.env.example 만 갱신"
        language: fail
        files: (^|/)\.env(\..+)?$
        exclude: \.env\.example$

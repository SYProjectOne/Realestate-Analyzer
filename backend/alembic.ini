# Alembic config (owner: WP0). Run from backend/: `uv run alembic upgrade head`
# Migration source of truth is the contract directory contracts/migrations/.
# DB URL: env DATABASE_URL wins; otherwise sqlalchemy.url below (dev SQLite).
# Keep this file ASCII-only: on Windows Alembic/logging read it with the locale codec (cp949).

[alembic]
script_location = %(here)s/../contracts/migrations
prepend_sys_path = .
path_separator = os
sqlalchemy.url = sqlite:///./dev.db
output_encoding = utf-8

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

[project]
name = "subscription-analyzer"
version = "0.1.0"
description = "지역 청약 리스트업·분석 도구 — backend (api, worker)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "httpx>=0.27",
  "httpcore>=1.0",
  "playwright>=1.48",  # context.route_web_socket (official_site 렌더 WebSocket 차단, R3b 마무리)
  "pdfplumber>=0.11",
  "pypdf>=5.0",
  "apscheduler>=3.10,<4",
  "mcp>=2,<3",  # 2.x API(server_info 등) 고정 — ADR-05 smoke
  "jinja2>=3.1",
  "openpyxl>=3.1",
  "python-dateutil>=2.9",
  "beautifulsoup4>=4.12",
  "lxml>=5.2",
  "pyyaml>=6.0",
  "jsonschema>=4.23",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# 스캔 공고문 OCR (DECISIONS D5 · ADR-12: RapidOCR PP-OCRv5 korean). 없으면 '확인 불가(스캔)' + 사람 입력.
ocr = ["rapidocr>=3.10,<4", "onnxruntime>=1.18"]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "respx>=0.21",
  "schemathesis>=3.34",
  "hypothesis>=6.112",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-python-dateutil",
  "types-PyYAML",
  "types-jsonschema",
  "datamodel-code-generator>=0.26",
  "pre-commit>=3.8",
  "openapi-spec-validator>=0.7",
  "pgserver>=0.1.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --import-mode=importlib"
markers = [
  "live: hits real external sites (skipped by default; run with -m live)",
  "slow: slow tests",
  "postgres: needs a Postgres DATABASE_URL",
  "regress: regression suite on fixtures (python scripts/tasks.py regress)",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # 한글 문자열의 전각 기호 허용

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = ["pdfplumber.*", "respx.*", "apscheduler.*", "openpyxl.*", "schemathesis.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
skip_empty = true
show_missing = true

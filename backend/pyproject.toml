[project]
name = "subscription-analyzer"
version = "0.1.0"
description = "지역 청약 리스트업·분석 도구 — backend (api, worker)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "httpx>=0.27",
  "playwright>=1.47",
  "pdfplumber>=0.11",
  "pypdf>=5.0",
  "apscheduler>=3.10,<4",
  "mcp>=1.2",
  "jinja2>=3.1",
  "openpyxl>=3.1",
  "python-dateutil>=2.9",
  "beautifulsoup4>=4.12",
  "lxml>=5.2",
  "pyyaml>=6.0",
  "jsonschema>=4.23",
  "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "respx>=0.21",
  "schemathesis>=3.34",
  "hypothesis>=6.112",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-python-dateutil",
  "types-PyYAML",
  "types-jsonschema",
  "datamodel-code-generator>=0.26",
  "pre-commit>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
markers = [
  "live: hits real external sites (skipped by default; run with -m live)",
  "slow: slow tests",
  "postgres: needs a Postgres DATABASE_URL",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # 한글 문자열의 전각 기호 허용

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = ["pdfplumber.*", "respx.*", "apscheduler.*", "openpyxl.*", "schemathesis.*"]
ignore_missing_imports = true

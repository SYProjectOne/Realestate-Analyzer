    LivingArea:
      title: LivingArea
      description: |-
        생활권 1개 (DECISIONS D2-2, region.living_areas json의 원소). 기본값은 시군구 1개당 생활권 1개이고, 사용자가 G0-2 화면에서 법정동을 옮겨 나누거나 묶는다. 한 region 안에서 모든 법정동은 정확히 한 생활권에 속한다. complex.living_area 는 단지 주소의 법정동 코드로 자동 배정된다.
        households = 소속 법정동에 걸친 행정동 세대수 합(행정동 1:N 법정동 매핑은 균등 분할) — 라벨 '추정', reason '주민등록 세대'.
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - legal_dong_codes
      - households
      properties:
        id:
          description: region 안에서 유일한 생활권 id ('la_1' …). 생성 후 바뀌지 않는다
          type: string
          pattern: ^la_[0-9A-Za-z_]+$
        name:
          type: string
          minLength: 1
          maxLength: 64
        legal_dong_codes:
          type: array
          minItems: 1
          description: 법정동 코드 10자리 문자열
          items:
            type: string
        legal_dongs:
          description: legal_dong_codes 와 같은 순서의 법정동 코드·이름(G0-2 생활권 편집 화면 표시용, 2026-10-09.2). 응답에서 서버가 legal_dong 표로 채운다 — 저장 json(region.living_areas)에는 없어도 된다
          type: array
          items:
            $ref: '#/components/schemas/LegalDongRef'
        households:
          description: 생활권 세대수 Fact. 아직 집계 전이면 null
          anyOf:
          - $ref: '#/components/schemas/Fact'
          - type: 'null'
        supply_ref_units:
          description: 공급 기준치 U_ref = households × region.supply_ref_pct (라벨 추정). households가 없으면 null
          anyOf:
          - $ref: '#/components/schemas/Fact'
          - type: 'null'
      examples:
      - id: la_1
        name: 연수구
        legal_dong_codes:
        - '2818510600'
        legal_dongs:
        - code: '2818510600'
          name: 송도동
          full_name: 인천광역시 연수구 송도동
        households:
          v: 61480
          label: 추정
          reason: 주민등록 세대
          prov: fp_7001
          checked_at: '2026-10-01'
          unit: units
        supply_ref_units:
          v: 4918
          label: 추정
          reason: 세대수×0.08
          prov: fp_7001
          checked_at: '2026-10-01'
          unit: units
    LivingAreaInput:
      title: LivingAreaInput
      description: PUT /regions/{id}/living-areas 의 생활권 1개. id를 주면 그 생활권의 이름·구성을 바꾸고, 없으면 새 생활권을 만든다. 빠진 기존 생활권은 삭제된다(비어 있을 때만 허용 — 법정동이 남아 있으면 422).
      type: object

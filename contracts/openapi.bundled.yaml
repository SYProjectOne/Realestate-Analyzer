        원문 1건 (RA §3 raw_document) — Collector.fetch의 반환 원소, Parser.parse의 입력. 원문 파일은 RAW_DIR/{source_kind}/{yyyy-mm-dd}/{sha256}.{ext}.
        - 멱등: sha256 유일 — 같은 내용이면 저장하지 않고 기존 행을 돌려준다.
        - 실패도 데이터: 403·5xx는 http_status에, DNS 실패·타임아웃은 http_status=null + error_text. 실패 행의 sha256 = sha256('fail:' + url + ':' + (http_status 또는 error 종류) + ':' + fetched_at의 날짜) — 같은 날 재시도는 중복 저장되지 않고 날마다 한 행이 남는다. 실패 행은 path=null.
        - official_site의 팝업 스크린샷은 image_hash(지각 해시 또는 sha256)를 남겨 변경 감지(WP7)에 쓴다.
      type: object
      additionalProperties: false
      required:
      - source_kind
      - url
      - fetched_at
      - http_status
      - sha256
      - path
      - content_type
      - text_path
      - complex_id
      properties:
        id:
          type:
          - integer
          - 'null'
        source_kind:
          $ref: '#/components/schemas/SourceKind'
        url:
          type: string
          minLength: 1
        fetched_at:
          type: string
          format: date-time
        http_status:
          type:
          - integer
          - 'null'
        sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
        path:
          description: RAW_DIR 기준 상대 경로. 실패 행은 null
          type:
          - string
          - 'null'
        content_type:
          type:
          - string
          - 'null'
        text_path:
          description: 추출 텍스트(pdfplumber txt, DOM 텍스트) 상대 경로
          type:
          - string
          - 'null'
        table_path:
          description: '추출 표 JSON 상대 경로(공고문 PDF: pdfplumber extract_tables → [{page, tables: [[[셀…]…]…]}], 표가 있는 페이지만). 표가 없거나 실패 행이면 null — 2026-10-09.2'
          type:
          - string
          - 'null'
        complex_id:
          type:
          - integer
          - 'null'
        region_id:
          type:
          - integer
          - 'null'
        error_text:
          description: |-
            실패·부분 실패 사유 한 단어(+세부). 값 목록(2026-10-09.2):
            - 응답 없음: 'DNS' · 'timeout' · 'connect' · 'TLS' · 'network' · 'robots'(robots.txt 규칙상 불허) · 'robots.txt <코드>'(robots.txt 5xx로 전부 불허) · 'invalid_url' · 'render'(헤드리스 렌더 실패)
            - 성공 응답이지만 내용 문제(공고문 PDF): 'scan'(텍스트 레이어 없음 → 확인 불가(스캔)) · 'ocr'(전 페이지 OCR → 값 라벨 '추정(OCR)') · 'scan_partial:<p,…>' · 'ocr_partial:<p,…>'(1부터 센 페이지) · 'pdf_parse: <사유>'(파서 모두 실패) · 'not_pdf'(200이지만 PDF 아님)
            - 그 밖의 파싱 실패는 '<단계>: <사유>' 형식. 4xx·5xx 응답은 error_text 대신 http_status
          type:
          - string
          - 'null'
        image_hash:
          type:
          - string
          - 'null'
          maxLength: 64
        meta:
          description: '수집기 부가 정보 JSON(원문 파일과 별도) — 예 official_site: {final_url, render: {reason, rendered, error, screenshot_sha256, signature, popups[{selector, sha256, width, height, images, text_sha256, dhash, signature}]}, intake_candidates[]} — render.signature·popups[].signature 는 시각·애니메이션을 무시한 안정 해시(DOM 텍스트 정규화 sha256 + perceptual dhash, 변경 감지는 이것으로 — R3 M13, 계약 2026-10-09.4 문서화), notice_pdf: {pages, ocr_pages[]}. 키는 source_kind별로 수집기가 정하고 README에 적는다. 판단 값을 넣지 않는다 — 2026-10-09.2'
          type:
          - object
          - 'null'
          additionalProperties: true
      examples:
      - id: 9031
        source_kind: official_site
        url: https://opus-switzen.com/
        fetched_at: '2026-10-07T09:14:00+09:00'
        http_status: 403
        sha256: 3f1d2c4b5a69788796a5b4c3d2e1f0a9b8c7d6e5f4a3b2c1d0e9f8a7b6c5d4e3

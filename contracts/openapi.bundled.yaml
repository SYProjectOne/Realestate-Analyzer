      - land_type
      - price_cap
      - regulated
      - units_total
      - units_general
      - units_special
      - officetel_units
      - notice_date
      - apply_dates
      - winner_date
      - contract_dates
      - move_in_ym
      - resale_months
      - resale_release_on_registration
      - residency_months
      - rewin_restriction_years
      - inclusion_class
      - inclusion_decision
      - inclusion_prob

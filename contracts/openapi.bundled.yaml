    Complex:
      title: Complex
      description: |-
        단지 1개 = 한 공고 단지 (RA §3 complex, meta §1-5). 수치·날짜·공고 항목은 Fact, 이름·주소 같은 식별 문자열은 맨 문자열이다. ComplexDetail.header 와 픽스처 complexes.json(ComplexBundle.complex)이 이 모양이다.
        - applyhome_id 유일(공고 전 단지는 null). 개명은 former_names에 추가하고 행은 유지.
        - living_area: region.living_areas[].id. 단지 주소의 법정동 코드(legal_dong_code)로 자동 배정.
        - housing_type(민영/국민), land_type(공공택지/민간택지), price_cap(적용/미적용), regulated(규제/비규제)는 v가 그 한국어 문자열인 Fact.
        - resale_end = winner_date + resale_months (산술, 라벨 추정 reason '산술'); resale_release_on_registration은 v='등기 시 해제' | '해당 없음' (공고에 문구가 있을 때만 '등기 시 해제').
        - inclusion_class: 포함/제외 분류(판정기 classify 7클래스) 또는 '범위 경계'(주소가 region 법정동에 매칭 안 됨, D2-6) 또는 '미분류'(classify 전). inclusion_decision이 review·manual_review면 미해결.
        - track: (A) 청약 진행·예정 / (B) 잔여물건 (meta §1-3).

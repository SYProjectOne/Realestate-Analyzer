        region_id:
          type: integer
        applyhome_id:
          description: 청약홈 공고 단지 id. (region_id, applyhome_id) 유일(계약 2026-10-09.4 — 같은 공고 단지가 지역마다 따로 있을 수 있다, W4). 공고 전이면 null
          type:
          - string
          - 'null'
          maxLength: 32
        name:
          type: string
          minLength: 1
          maxLength: 200
        former_names:
          type: array
          items:
            type: string
        address:

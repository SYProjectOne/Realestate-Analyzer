    Weights:
      title: Weights
      description: 가중치 6개(각 0~1, 합 = 1). 저장되는 시나리오 가중치는 10진 합이 정확히 1(검증 허용 오차 1e-9), 민감도 변형 가중치는 표시 반올림 때문에 1e-6까지 허용. liquidity와 move_in 중 정확히 하나만 있다.
      type: object
      additionalProperties: false
      required:
      - p10
      - rerank
      - gap
      - benchmark
      - supply
      properties:
        p10:
          x-nonfact: 시나리오 가중치 가정(내장·사용자 설정, 출처 데이터 아님)
          type: number
          minimum: 0
          maximum: 1
        rerank:
          x-nonfact: 시나리오 가중치 가정(내장·사용자 설정, 출처 데이터 아님)
          type: number
          minimum: 0
          maximum: 1
        gap:
          x-nonfact: 시나리오 가중치 가정(내장·사용자 설정, 출처 데이터 아님)
          type: number
          minimum: 0
          maximum: 1
        benchmark:
          x-nonfact: 시나리오 가중치 가정(내장·사용자 설정, 출처 데이터 아님)
          type: number
          minimum: 0
          maximum: 1
        supply:
          x-nonfact: 시나리오 가중치 가정(내장·사용자 설정, 출처 데이터 아님)
          type: number
          minimum: 0
          maximum: 1
        liquidity:
          x-nonfact: 시나리오 가중치 가정(내장·사용자 설정, 출처 데이터 아님)
          type: number
          minimum: 0
          maximum: 1
        move_in:
          x-nonfact: 시나리오 가중치 가정(내장·사용자 설정, 출처 데이터 아님)
          type: number
          minimum: 0
          maximum: 1
      if:
        required:
        - liquidity
      then:
        not:
          required:
          - move_in
      else:
        required:
        - move_in

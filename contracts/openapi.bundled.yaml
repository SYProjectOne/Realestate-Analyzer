    PriceRange:
      title: PriceRange
      description: '현재 구매가 범위(§6-1): low = 대표층 공급금액 + 발코니 + 필수 옵션 − 할인(확인됨일 때만, D11-6), high = 최고가 + 발코니 + 필수 옵션 − 할인, mid = (low+high)/2. composition은 구성 설명 문자열(예 ''공급가 + 발코니 314만 − 할인 1,000만'').'

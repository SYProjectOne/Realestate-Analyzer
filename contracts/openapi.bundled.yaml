    Health:
      title: Health
      description: 'GET /health — 인증 없음. docker compose 헬스체크와 화면 전역 배너용. status=degraded면 db 또는 judge 중 하나가 정상이 아니다(판정기 장애 시 수집·조회는 계속된다). db=error면 HTTP 503(같은 본문), 그 밖은 200. judge = 지역마다 최신 스냅샷의 degraded 플래그: 하나라도 degraded면 degraded, 스냅샷이 있고 모두 정상이면 ok, 스냅샷이 없거나 DB 장애면 unknown. contract_version은 이 서버가 구현한 계약 버전(contracts/CHANGELOG.md 최신 항목), app_version은 패키지 버전, time은 응답 시각(+09:00).'
      type: object
      additionalProperties: false
      required:
      - status
      - contract_version
      - app_version
      - db
      - judge
      - time
      properties:
        status:
          type: string
          enum:
          - ok
          - degraded
        contract_version:
          type: string
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}\.[0-9]+$
        app_version:
          type: string
        db:
          type: string
          enum:
          - ok
          - error
        judge:
          type: string
          enum:
          - ok
          - degraded
          - unknown
        time:
          type: string
          format: date-time
      examples:
      - status: ok
        contract_version: 2026-10-09.3
        app_version: 0.1.0
        db: ok
        judge: unknown
        time: '2026-10-09T09:00:00+09:00'
    HumanCheck:
      title: HumanCheck
      description: '사람 확인 1건 (RA §3 human_check) — G7 HumanCheckForm. field=''intake_status''이면 value_text는 접수 상태(가능/미정/확인 불가/불가)이고, 서버가 그 기준일의 쓰기 가능 리비전(발행됐으면 새 리비전 — D11-1)에 intake_status 행(path=human_check)과 change_event(critical, triggers_rejudge)를 만들고 rejudge 잡을 제안한다(T3). field 가 강등 가능한 사실 필드(HumanCheckField — max_price_won·move_in_ym·resale_months·residency_months·down_payment_pct)면 그 값이 resolver 0순위 후보(source_rank 0, 라벨 확인됨, reason ''사람 확인(kind)'')로 사실을 바꾸고 재정규화에도 유지되며, 같은 사실의 강등(검증 모순)을 복원한다(D11-3, 계약 2026-10-09.8). entity·entity_id = 바뀐 사실 행(가격은 현재 공고의 payment_terms 또는 기준 타입 complex_type). entered_by는 역할 문자열만(EnteredByRole: 운영자·검토자), 사람 이름 금지. 통화 내용은 요약만(note ≤ 500자, guard: 전화·주민번호·이메일·비밀값 금지 → 422).'
      type: object
      additionalProperties: false
      required:
      - id
      - complex_id
      - field
      - value_text
      - kind
      - checked_at
      - entered_by
      - note
      properties:
        id:
          type: integer
        complex_id:
          type: integer
        field:
          type: string
          minLength: 1
          maxLength: 64
          description: HumanCheckField 값(옛 행은 자유 문자열일 수 있다)
        entity:
          description: 바뀐 사실 행의 테이블(complex·complex_type·payment_terms). 접수 상태·기타·옛 행은 null (계약 .8)
          type:
          - string
          - 'null'
          maxLength: 32
        entity_id:
          description: 바뀐 사실 행 id. 접수 상태·기타·옛 행은 null (계약 .8)
          type:
          - integer
          - 'null'
        value_text:
          type: string
        kind:
          type: string
          enum:
          - phone
          - visit
          - email
        checked_at:
          type: string
          description: 입력한 확인 시각 그대로(계약 .11부터 시간대가 붙은 RFC3339 — HumanCheckCreate). .10 이전 옛 행은 날짜만('2026-10-09')일 수 있다
        entered_by:
          type: string
          maxLength: 32
        note:
          type:
          - string
          - 'null'
        created_intake:
          anyOf:
          - $ref: '#/components/schemas/Intake'
          - type: 'null'
        change_event_id:
          type:
          - integer
          - 'null'
        suggested_job:
          description: '계약 .9(D12-5): 재판정은 자동 등록된다(rejudge_job_id). 이 값은 그 잡과 같은 payload(호환) — POST /jobs 로 보내도 대기 중인 같은 잡을 돌려준다(중복 등록 없음). 자동 등록이 없으면(''기타'') null'
          anyOf:
          - $ref: '#/components/schemas/JobCreate'
          - type: 'null'
        rejudge_job_id:
          description: 자동 등록한 rejudge 잡 id(계약 .9, D12-5). 사실 필드·접수 상태면 그 지역 가장 새 (기준일, 리비전)의 쓰기 가능 리비전에 등록(M-2 — 발행됐으면 새 리비전). '기타'·스냅샷 없음이면 null
          type:
          - integer
          - 'null'
        job_id:
          description: '계약 .11(D14-5): 화면이 감시할 잡 id = rejudge_job_id(발행을 부르는 쓰기 응답의 공통 이름 — 그 잡이 새 리비전을 판정·발행할 때까지 이전 발행 리비전이 기본 화면). 사람 확인은 자원을 만드는 POST 라 201 그대로'
          type:
          - integer
          - 'null'
        basis_type_code:
          description: '계약 .14(D17-4): field=discount 면 그 사람 확인이 들어간 기준 타입 코드(''84A'' — payment_terms.discount_by_type.<기준 타입>, 화면 안내 ''기준 타입 84A 할인으로 반영''). 할인이 아니면 null. 기준 타입이 나중에 바뀌면(84㎡에 더 가까운 타입) 이 할인은 그 타입 칸 표시만 남고 구매가에서 빠지지 않는다'
          type:

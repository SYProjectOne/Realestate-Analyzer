    ResolvedFields:
      title: ResolvedFields
      description: |-
        Resolver.resolve(candidates)의 결과 (RA §4-3). §3 우선순위로 (entity, entity_id|entity_key, field)마다 후보 하나를 chosen으로 정하고, 모든 후보를 field_provenance 행(provenance)으로 돌려준다(chosen 하나, 나머지 chosen=false 보관).
        값이 다른 후보가 둘 이상이면 conflict_group으로 묶는다(T5: 해링턴 1,573 vs 1,769 → conflict_group 1건, chosen=청약홈 상세).
        needs_compare 규칙(RA §3 표를 하나로 정리): 값이 다른 최상위 후보 둘이 모두 1차(primary=true)이고 source_rank가 같으며 출처 종류가 달라 §3 우선순위로 가를 수 없을 때만 true(같은 출처 종류는 최신 규칙). 이 경우 **채택 보류**(R3 M1, 계약 2026-10-09.4): 우선순위 대표 후보(최신)의 출처 행은 chosen=true(compare 상대를 찾는 기준)이고 reason 앞에 '출처 상충 — compare 대기'를 붙이며, ResolvedFields.chosen 에는 값 없는 '확인 불가' 후보를 내 사실 테이블 값을 비운다(점수 미사용, 화면 '확인 불가(출처 상충 …)'). compare 결과로만 채택한다 — contradicts면 공고문 채택·병기, same_fact·different_facts 도 apply_compare 가 표식을 남긴다. 우선순위가 있는 경우(청약홈 상세 rank 1 vs 공고문 rank 2 등)와 1차 vs 2차는 compare 없이 rank 1 채택. 둘 다 2차면 병기하고 판정 미사용.
      type: object
      additionalProperties: false
      required:
      - chosen
      - provenance
      - conflicts
      - needs_compare
      properties:
        chosen:
          type: array
          items:
            $ref: '#/components/schemas/FieldCandidate'
        provenance:
          type: array
          items:
            $ref: '#/components/schemas/ProvenanceRow'
        conflicts:
          type: array
          items:
            $ref: '#/components/schemas/ConflictGroup'
        needs_compare:
          description: conflicts 중 needs_compare=true가 하나라도 있으면 true
          type: boolean
      examples:
      - chosen:
        - entity: complex
          entity_id: 13
          entity_key: '2025000271'
          field: units_total
          value_text: 1,573
          value: 1573
          source_rank: 1
          source_kind: applyhome_detail
          primary: true
          label: 확인됨
          reason: null
          excerpt: 공급세대수 1,573세대
          excerpt_start: null
          excerpt_end: null
          raw_document_id: 9101
          url: https://www.applyhome.co.kr/
          checked_at: '2026-10-07'
          needs_extract: false
        provenance:
        - id: null
          entity: complex
          entity_id: 13
          entity_key: '2025000271'
          field: units_total
          value_text: 1,573
          raw_document_id: 9101
          url: https://www.applyhome.co.kr/
          checked_at: '2026-10-07'
          label: 확인됨
          reason: null
          source_rank: 1
          chosen: true
          conflict_group: complex:13:units_total
          excerpt: 공급세대수 1,573세대
          excerpt_start: null

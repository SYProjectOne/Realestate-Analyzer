          description: '계약 2026-10-09.10(R3 5차 minor): discount 를 low·high·mid 에서 **실제로 뺐는가**(서버 판정 — 라벨 확인됨 + 0 < 할인 < 대표층가·최고가). 화면의 ''구매가에서 뺌'' 문구는 이 값만 본다(0·음수·과대·추정 할인은 false). 할인이 없으면 false'

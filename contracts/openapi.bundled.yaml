          - string
          - 'null'
          pattern: ^[0-9]{10}$
        living_area:
          description: region.living_areas[].id. 배정 전이면 null
          type:
          - string
          - 'null'
        living_area_name:
          type:
          - string
          - 'null'
        official_site_url:

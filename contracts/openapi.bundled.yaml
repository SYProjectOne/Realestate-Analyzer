          $ref: '#/components/schemas/Fact'
        intake_open_count:
          description: 접수 가능 수(표시 intake status='가능')
          $ref: '#/components/schemas/Fact'
        unsold:
          title: KpiUnsold
          type: object
          additionalProperties: false
          required:
          - ym
          - total
          - post_completion
          properties:
            ym:
              type:
              - string
              - 'null'
            total:
              $ref: '#/components/schemas/Fact'
            post_completion:
              $ref: '#/components/schemas/Fact'
        move_in_peak:
          title: KpiMoveInPeak
          type: object
          additionalProperties: false
          required:
          - year
          - units
          properties:
            year:
              $ref: '#/components/schemas/Fact'
            units:
              $ref: '#/components/schemas/Fact'
        data_freshness:
          title: KpiFreshness
          description: last_success_at.v = 소스 중 가장 오래된 '최종 성공 수집' 시각(ISO). stale_sources = 기준(일간 소스 26시간, 주간 소스 8일)보다 오래된 소스 수, failing_sources = 최근 시도가 실패한 소스 수.

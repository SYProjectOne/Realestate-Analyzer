                    scheduled_at: '2026-10-09T11:00:00+09:00'
                    started_at: null
                    finished_at: null
                    status: queued
                    stats: {}
                    error_text: null
                    progress: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: contradicted 가 아님·이미 분할됨·재검증 대기 중

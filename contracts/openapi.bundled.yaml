      tags:
      - ops-health
      operationId: getHealth
      summary: 헬스체크 (인증 없음)
      security: []
      responses:
        '200':
          description: 서버 상태
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              examples:
                ok:
                  summary: 정상
                  value:
                    status: ok
                    contract_version: 2026-10-09.3
                    app_version: 0.1.0
                    db: ok
                    judge: ok
                    time: '2026-10-08T09:00:00+09:00'
        '503':
          description: DB 장애 — 같은 Health 본문(status=degraded, db=error). docker compose 헬스체크가 실패로 본다. 판정기 장애만이면 200 + judge=degraded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              examples:
                dbDown:
                  summary: DB 장애(503)
                  value:
                    status: degraded
                    contract_version: 2026-10-09.3
                    app_version: 0.1.0
                    db: error
                    judge: unknown
                    time: '2026-10-09T09:00:00+09:00'
        '500':
          $ref: '#/components/responses/InternalError'

  /regions/resolve:
    get:
      tags:
      - regions
      operationId: resolveRegion
      summary: 자유 지명 → 후보 (G0 자동완성)
      description: 이름 부분 일치(공백·'시/군/구/동/읍/면' 접미사 무시), 정확 일치 우선. 판정기 호출 없음. 결과 최대 50개.
      parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 50
        example: 검단
      responses:
        '200':
          description: '후보 목록(정렬: match → kind → full_name)'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RegionCandidate'
              examples:
                geomdan:
                  summary: '''검단'' 검색 후보'
                  description: 코드는 행정표준코드관리시스템 법정동코드 전체자료(contracts/fixtures/reference/legal_dong_full.zip) 기준. 2026-07 분구로 서구(28260)는 폐지 코드(active=false)라 후보에 나오지 않고 검단구(28290)만 나온다. 분구 직후 표가 아직 옛 코드뿐이면 옛 코드가 active라 그것이 나온다(DECISIONS D3).
                  value:
                  - kind: sigungu
                    code: '28290'
                    full_name: 인천광역시 검단구
                    legal_dong_codes:
                    - '2829010400'
                    - '2829010500'
                    - '2829010300'
                    - '2829010600'
                    - '2829010700'
                    match: partial

                    full_name: 인천광역시 검단구 검단동
                    legal_dong_codes:
                    - '2829010300'
                    - '2829010700'
                    match: exact
                    sigungu_code: '28290'
                    sido_code: '28'
                  - kind: legal_dong
                    code: '2829010300'
                    full_name: 인천광역시 검단구 마전동
                    legal_dong_codes:
                    - '2829010300'
                    match: partial
                    sigungu_code: '28290'
                    sido_code: '28'
        '401':

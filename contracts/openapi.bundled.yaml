      description: |-
        단지의 타입(평형) 1개 (RA §3 complex_type). (complex_id, type_code) 유일. 판정 기준 타입은 전용 84㎡에 가장 가까운 것(is_basis=true, 동률이면 type_code 사전순 첫째).
        현재 구매가(RA §6-1): P_low = floor_sample_price_won + balcony_won + options_required_won, P_high = max_price_won + balcony_won + options_required_won, P_mid = (P_low + P_high)/2. 할인은 label=확인됨인 것만 뺀다. 임의공급에서 가격이 바뀌면 최신 payment_terms.effective_from 공고의 값.

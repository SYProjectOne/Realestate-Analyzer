    HumanCheckCreate:
      title: HumanCheckCreate
      description: POST /ops/human-checks 본문
      type: object
      additionalProperties: false
      required:
      - complex_id
      - field
      - value_text
      - kind
      - checked_at
      - entered_by
      properties:
        complex_id:
          type: integer
        field:
          $ref: '#/components/schemas/HumanCheckField'
        entity_id:
          description: '사실 행 지정(선택): 가격은 그 단지의 payment_terms 또는 complex_type id, 계약금은 payment_terms id. 없으면 현재 공고·기준 타입·현재 납부 조건'
          type:
          - integer
          - 'null'
        value_text:
          type: string
          minLength: 1
          maxLength: 200
        kind:
          type: string
          enum:
          - phone
          - visit
          - email
        checked_at:
          type: string
          format: date-time
          description: 확인 시각 = 시간대가 붙은 RFC3339 date-time(예 2026-10-09T10:20:00+09:00·…Z, 계약 .11 D14-6). 날짜만·시간대 없는 시각·서버 시계보다 10분 넘게 미래 → 422(loc body.checked_at). 날짜 비교(이른 확인일 422·사람 확인 이후 관측)는 KST 날짜 기준
        entered_by:

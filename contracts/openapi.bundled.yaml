    JobRun:
      title: JobRun
      description: |-
        잡 1건 (RA §3 job_run, ADR-3). api는 행을 넣기만 하고(queued) worker가 polling해 집는다. 잡 잠금: worker는 UPDATE … SET status='running', locked_by=<worker id> WHERE id=? AND status='queued' 가 1행을 바꿨을 때만 실행한다(동시 실행 2개 → 하나만 동작).
        payload는 job_name별 스키마(job_payloads/*.json)를 따른다. stats는 잡이 남기는 집계(수집 건수, 판정 호출 수, cached 수, degraded 여부, report의 파일 정보 등).
        report 잡이 done이면 stats = {path, filename, size_bytes, sha256, content_type}이고 GET /reports/{id}(id = job_run.id)가 그 파일을 준다.
      type: object
      additionalProperties: false
      required:
      - id
      - job_name
      - kind
      - payload
      - scheduled_at
      - started_at
      - finished_at
      - status
      - stats
      - error_text
      properties:
        id:
          type: integer
        job_name:
          $ref: '#/components/schemas/JobName'
        kind:
          type: string
          enum:
          - scheduled
          - manual
          - rejudge
        payload:
          type: object
          additionalProperties: true
        scheduled_at:
          type: string
          format: date-time
        started_at:
          type:
          - string
          - 'null'
          format: date-time
        finished_at:
          type:
          - string
          - 'null'
          format: date-time
        status:
          type: string
          enum:
          - queued
          - running
          - done
          - failed
        stats:
          type: object
          additionalProperties: true
        error_text:
          type:
          - string
          - 'null'
        progress:
          description: 진행률(선택). 화면 JobProgress가 2초 폴링
          anyOf:
          - title: JobProgress
            type: object
            additionalProperties: false
            required:
            - done
            - total
            properties:
              done:
                type: integer
                minimum: 0
              total:
                type: integer
                minimum: 0
              step:
                type:
                - string
                - 'null'
          - type: 'null'
      allOf:
      - if:
          properties:
            job_name:
              const: collect.daily
        then:
          properties:
            payload:
              $ref: '#/components/schemas/CollectDailyPayload'
      - if:
          properties:
            job_name:
              const: collect.weekly
        then:
          properties:
            payload:
              $ref: '#/components/schemas/CollectWeeklyPayload'
      - if:
          properties:
            job_name:
              const: rejudge
        then:
          properties:
            payload:
              $ref: '#/components/schemas/RejudgePayload'
      - if:
          properties:
            job_name:
              const: report
        then:
          properties:
            payload:
              $ref: '#/components/schemas/ReportRequest'
      - if:
          properties:
            job_name:
              const: snapshot.publish
        then:
          properties:
            payload:
              $ref: '#/components/schemas/SnapshotPublishPayload'
      - if:
          properties:
            job_name:
              const: reference.refresh
        then:
          properties:
            payload:
              $ref: '#/components/schemas/ReferenceRefreshPayload'
      - if:
          properties:
            job_name:
              const: region.bootstrap
        then:
          properties:
            payload:
              $ref: '#/components/schemas/RegionBootstrapPayload'
      - if:
          properties:
            job_name:
              const: claim.reverify
        then:
          properties:
            payload:
              $ref: '#/components/schemas/ClaimReverifyPayload'
      - if:
          properties:
            job_name:
              const: backup
        then:
          properties:
            payload:
              $ref: '#/components/schemas/BackupPayload'
      - if:
          properties:
            job_name:
              const: region.expand
        then:
          properties:
            payload:
              $ref: '#/components/schemas/RegionExpandPayload'
      examples:

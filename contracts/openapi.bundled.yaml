      - 운영자
      - 검토자
    Error:
      title: Error
      description: |-
        모든 4xx·5xx 응답 본문 (RA §4-1).
        code 의미와 HTTP 상태:
        - unauthorized (401): 토큰 없음·불일치
        - forbidden (403): 읽기 전용 토큰으로 GET 이외 호출
        - not_found (404): 리소스 없음
        - validation_error (422): 요청 검증 실패 (field_errors 채움). 생활권 편집에서 법정동 누락·중복도 여기
        - conflict (409): 상태 충돌 (예: 완료되지 않은 보고서 다운로드)
        - publish_blocked (409): contradicted claim이 남아 publish·보고서 생성 불가 (detail에 개수)
        - intake_unknown (422): 접수 상태가 확인 불가라 요청한 동작(후보 포함 등)을 할 수 없음
        - judge_unavailable (503): 판정기 다운(degraded). 조회는 계속 가능
        - contract_violation (500): 출처(provenance) 없는 수치를 내보내려 함 (ENV=dev, 발행 전 리비전 실시간 GET)
        - scenario_not_in_revision (422): 계약 .11(D14-3) — 보고서 대상 리비전에 그 시나리오 저장본이 없다(발행 뒤 만든 사용자 시나리오, field_errors loc body.scenario_id)
        - stored_view_mismatch (500): 계약 .11(D14-4) — 발행 리비전 저장본의 sha256·계약 버전이 맞지 않는다(조용히 내보내지 않는다, 서버 로그)
        - materialize_pending (503): 계약 .11(D14-9) — 발행 리비전 저장본을 아직 만들지 않았다(backfill 대기, Retry-After). 계약 .12(D15-3): 그 (리비전, kind, 시나리오) 완료 표식이 없거나 미완
        - checked_at_format (422): 계약 .12 — POST /ops/human-checks checked_at 이 시간대가 붙은 RFC3339 가 아니거나(T·Z 대소문자 무관) KST 2000-01-01 이전·overflow(field_errors loc body.checked_at)
        - checked_at_future (422): 계약 .12 — checked_at 이 서버 지금보다 10분 넘게 미래
        - checked_at_before_source (422): 계약 .12 — 그 의미 필드에 확인일(KST 날짜)보다 뒤에 관측된 공식 공고가 다른 값으로 이미 있다(D13-2·D14-6 — 같은 값이면 201)
        - discount_format (422): 계약 .14(R3i m2) — POST /ops/human-checks field=discount 의 value_text 형식·범위가 틀렸다(ASCII 숫자, 쉼표는 세 자리마다, 끝에 '원' 하나 — 띄우지 않음, 0 ~ 1천억 정수. 다른 칸도 틀리면 validation_error)
        - discount_not_below_price (422): 계약 .14(R3i m2) — 할인이 기준 타입 차감 바탕(대표층가·최고가 중 낮은 값) 이상(구매가에서 뺄 수 없다, field_errors loc body.value_text)
        - internal (500): 그 밖의 서버 오류
      type: object
      additionalProperties: false
      required:
      - code
      - detail
      properties:
        code:
          type: string
          enum:
          - unauthorized
          - forbidden
          - not_found
          - validation_error
          - conflict
          - publish_blocked
          - intake_unknown
          - judge_unavailable
          - contract_violation
          - internal
          - scenario_not_in_revision
          - stored_view_mismatch
          - materialize_pending
          - checked_at_format
          - checked_at_future
          - checked_at_before_source
          - discount_format
          - discount_not_below_price
        detail:
          type: string
        field_errors:
          type:
          - array
          - 'null'
          items:
            type: object
            additionalProperties: false
            required:
            - loc
            - msg
            properties:
              loc:
                type: array
                items:
                  type:
                  - string
                  - integer
              msg:
                type: string
        request_id:
          type:
          - string
          - 'null'
      examples:
      - code: not_found
        detail: complex 999 not found
      - code: contract_violation
        detail: complex 4 field max_price_won has no field_provenance row
      - code: validation_error
        detail: legal_dong 2829010300 is not assigned to any living area
        field_errors:
        - loc:
          - body
          - living_areas
          msg: every legal_dong must belong to exactly one living area
    ExpectedScores:
      title: ExpectedScores
      description: |-
        회귀 골든 파일 contracts/fixtures/<fixture>/expected_scores.json 의 스키마 (RA §9 (a)단계). 보고서의 구성 점수 6개를 입력으로 고정하고 가중 합·순위·동점만 검증한다(손 등급 시절의 숫자 그대로). (b)단계(§6-4 식으로 다시 계산한 값)는 expected_scores_v2.json으로 따로 고정한다(R1 끝, 사람 확인).
        - complexes[].components: 보고서 구성 점수(0~10, 입력). null이면 그 단지는 종합 미계산(보류·참고).
        - complexes[].report_total / report_rank: 보고서에 적힌 값(기대값의 원천). computed_total: 가중 합 원값(반올림 전) — |computed_total − report_total| ≤ tolerance.
        - complexes[].expected_rank / tie_group: RA §6-4 동점 규칙(|ΔS| < epsilon, 반올림 전 원값 비교, 리더 기준 그룹, 경쟁 순위)을 적용한 순위 — ScoreEngine이 내야 하는 값. 보고서 순위와 다르면 discrepancies에 적는다.
        - t1·t2: RA §9 수용 테스트 기대값. t7: 인천 8후보 → 16후보 rerank 변화. t12: §6-6 민감도를 같은 입력으로 계산한 값(사람 확인 전).
      type: object
      additionalProperties: false
      required:
      - fixture
      - contract_version
      - stage
      - source
      - weights
      - tie_rule
      - tolerance
      - complexes
      - t1
      - t2
      properties:
        fixture:
          type: string
        contract_version:
          type: string
        stage:

    JudgmentEnvelope:
      title: JudgmentEnvelope
      description: |-
        판정기 호출 1건의 봉투 (RA §4-1, judgment_log 행의 API 모양). JudgeAdapter의 9개 메서드가 모두 이것을 돌려준다.
        - status: ok(판정기 auto 결정) / review(판정기가 사람 검토로 넘김: review·escalate·manual_review·invalid_response 포함) / escaped(decide escape hatch: ask_user·investigate 선택, 질문을 남김) / blocked(guard 또는 screen block으로 호출 거부) / error(판정기 오류·미수신, JudgeUnavailable).
        - status가 review·escaped·blocked·error이면 result는 표시만 하고 점수·추천에 쓰지 않는다 — 거르는 곳은 프론트가 아니라 WP4(analysis).
        - cached=true는 같은 input_hash의 이전 행을 돌려준 것. 화면은 '캐시' 배지.
        - input_hash = 'sha256:' + hex(sha256(canonical JSON {tool, purpose, payload, adapter_version})). canonical JSON = 키 정렬, 구분자 (',', ':'), ensure_ascii=false, UTF-8.
        - adapter_version = '<어댑터 코드 버전>+jev-mcp@<서버 버전>+<모델>' (DECISIONS D6, 2026-10-09.2: 모델 = JEV 응답의 model, 예 jev-1.13.0 — 모델이 바뀌면 재판정). 모델을 아직 모르면 '+<모델>' 없이. MockAdapter는 녹화의 _meta.json 값.
        - result는 도구별 정규화 결과($defs의 <Tool>Result), raw는 판정기 원응답 그대로(임계값·decision 포함, DECISIONS D6).
        - 로그에는 payload 원문을 남기지 않는다(input_hash·길이만, AGENTS 13).
      type: object
      additionalProperties: false
      required:
      - tool
      - purpose
      - input_hash
      - status
      - confidence
      - cached
      - result
      - raw
      - duration_ms
      - judgment_seq
      - created_at
      properties:
        tool:
          $ref: '#/components/schemas/JudgeTool'
        purpose:
          description: '호출 목적 키. 예: ''screen:notice:<complex_id>'', ''extract:notice:<complex_id>'', ''noul:ladder:move_in_plus_1y'', ''rerank:region'', ''decide:scenario_B'', ''verify:section_8''. 같은 payload라도 purpose가 다르면 다른 input_hash.'
          type: string
          minLength: 1
          maxLength: 128
        input_hash:
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
        input_len:
          x-nonfact: 판정기 입력 길이(호출 메타 — 로그 규칙 13)
          description: canonical payload 길이(문자 수). 로그용
          type:
          - integer
          - 'null'
        status:
          type: string
          enum:
          - ok
          - review
          - escaped
          - blocked
          - error
        confidence:
          x-nonfact: 판정기 봉투 원값(G7 판정 로그 표시 전용) — 화면의 확률·순위는 Fact(jl_<seq>)로 따로 낸다
          description: 판정기가 준 신뢰도 0~1. 없으면 null
          type:
          - number
          - 'null'
          minimum: 0
          maximum: 1
        cached:
          type: boolean
        result:
          description: 도구별 정규화 결과 ($defs의 ScreenResult … VerifyResult). error·blocked면 {}.
          type: object
          additionalProperties: true
        raw:
          description: '판정기 원응답(JSON). 임계값·decision을 포함해 그대로 저장. blocked면 {"reason": …}.'
          type: object
          additionalProperties: true
        duration_ms:
          x-nonfact: 호출 소요 ms(운영 메타)
          type:
          - integer
          - 'null'
          minimum: 0
        judgment_seq:
          description: judgment_log.seq. 성공·실패 불문 모든 호출이 행을 가진다
          type:
          - integer
          - 'null'
        created_at:
          description: ISO 8601 시각
          type: string
          minLength: 10
        adapter_version:
          type:
          - string
          - 'null'
          maxLength: 64
        snapshot_id:
          type:
          - integer
          - 'null'
        complex_id:
          type:
          - integer
          - 'null'
        error_text:
          description: status=error·blocked 사유. payload 원문 금지
          type:
          - string
          - 'null'
      allOf:
      - if:
          properties:
            tool:
              const: screen
            status:
              const: ok
          required:
          - tool
          - status
        then:
          properties:
            result:
              $ref: '#/components/schemas/ScreenResult'
      - if:
          properties:
            tool:
              const: extract
            status:
              const: ok
          required:
          - tool
          - status
        then:
          properties:
            result:
              $ref: '#/components/schemas/ExtractResult'
      - if:
          properties:
            tool:
              const: audit
            status:
              const: ok
          required:
          - tool
          - status
        then:
          properties:
            result:
              $ref: '#/components/schemas/AuditResult'
      - if:
          properties:
            tool:
              const: classify
            status:
              const: ok
          required:
          - tool
          - status
        then:
          properties:
            result:
              $ref: '#/components/schemas/ClassifyResult'
      - if:
          properties:
            tool:
              const: compare
            status:
              const: ok
          required:
          - tool
          - status
        then:
          properties:
            result:
              $ref: '#/components/schemas/CompareResult'
      - if:
          properties:
            tool:
              const: noul
            status:
              const: ok
          required:
          - tool

          type: string
          enum:
          - auto
          - review
          - manual_review
        distribution:
          type: object
          additionalProperties:
            type: number
    ClassifyResult:
      title: ClassifyResult
      description: |-
        P4 분류. 포함/제외 7클래스(private_sale_apt, public_sale, public_rental, private_rental, non_apartment, out_of_scope, manual_review) 또는 호재 단계 5클래스(확정, 계획, 추진, 언론, 미확정). decision=review면 미해결.
        배치 분류(2026-10-09.2): 한 호출에 후보 여럿을 보내면 items[]에 후보별 결과를 입력 순서대로 담는다. 이때 최상위는 요약이다 — label='batch', prob = decision=auto 인 항목 비율(소수 4자리), decision = 모든 항목이 auto면 auto 아니면 review. 봉투 status는 모든 항목이 유효한 응답(invalid_response 아님)이면 ok — 항목별 미해결은 status가 아니라 items[].decision으로 거른다(auto만 사용, WP4·WP7).
      type: object
      required:
      - label
      - prob
      - decision
      properties:
        label:
          type: string
        prob:
          x-nonfact: 판정기 봉투 원값(G7 판정 로그 표시 전용) — 화면의 확률·순위는 Fact(jl_<seq>)로 따로 낸다
          type: number
        decision:
          type: string
          enum:
          - auto
          - review
          - manual_review
        distribution:
          type: object
          additionalProperties:
            type: number
        items:
          description: 배치 분류의 후보별 결과(입력 순서). 단건 분류면 없음
          type: array
          items:
            $ref: '#/components/schemas/ClassifyItem'
    CollectDailyPayload:
      title: CollectDailyPayload
      description: job_name='collect.daily' 페이로드 (RA §4-4). 스케줄러가 매일 06:00 지역마다 넣는다. applyhome_list는 청약홈 APT 분양정보·무순위/잔여세대 목록 2개를 sido_codes로 조회하고, 새·바뀐 공고는 같은 잡 안에서 상세(applyhome_detail)·공고문(notice_pdf)까지 받는다. official_site는 단지 공식 홈페이지 팝업을 렌더·스크린샷하고 이미지 해시로 변경을 감지한다. 수집 후 변경 감지 → 변경 단지만 rejudge 잡 등록.
      type: object
      additionalProperties: false
      required:
      - region_id
      - sources
      properties:
        region_id:
          type: integer
        sources:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum:
            - applyhome_list
            - applyhome_detail
            - notice_pdf
            - official_site
          default:
          - applyhome_list
          - official_site
        asof_date:
          description: 스냅샷 기준일. 생략 시 실행일(Asia/Seoul)
          type:
          - string
          - 'null'
          format: date
      examples:
      - region_id: 1
        sources:
        - applyhome_list
        - official_site
    CollectWeeklyPayload:
      title: CollectWeeklyPayload
      description: job_name='collect.weekly' 페이로드 (RA §4-4). 스케줄러가 매주 월 06:30. rtms=실거래 Open API(키 없으면 재가공 폴백, 라벨 재가공), stats=미분양·입주 물량, news=뉴스 검색 API(키 없으면 비활성 — 잡은 성공으로 끝나고 stats.skipped에 기록).
      type: object
      additionalProperties: false
      required:
      - region_id
      - sources
      properties:
        region_id:
          type: integer
        sources:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum:
            - rtms
            - stats
            - news
          default:
          - rtms
          - stats
          - news
        asof_date:
          type:
          - string
          - 'null'
          format: date
      examples:
      - region_id: 1
        sources:
        - rtms
        - stats
        - news
    CompareResult:
      title: CompareResult
      description: P5 출처 충돌. contradicts면 1차 자료 채택·2차 병기, 둘 다 2차면 병기·판정 미사용.
      type: object
      required:
      - overall
      properties:
        overall:
          type: string
          enum:
          - same_fact
          - contradicts
          - different_facts
          - review
        prob:
          x-nonfact: 판정기 봉투 원값(G7 판정 로그 표시 전용) — 화면의 확률·순위는 Fact(jl_<seq>)로 따로 낸다
          type:
          - number
          - 'null'
        aspects:
          type: array
          items:
            title: CompareAspect
            type: object
            required:
            - aspect
            - relation
            properties:
              aspect:
                type: string
              relation:
                type: string
                enum:
                - same_fact
                - contradicts
                - different_facts
                - review
              prob:
                type:
                - number
                - 'null'
    CompareView:
      title: CompareView
      description: GET /snapshots/{sid}/compare?ids=&scenario= — G4 비교, 2~6개 단지 (RA §4-2). rows = 선택 단지의 ScoreRow(C6 가로), components = 가중치·성분 순서(C6 제목), ladders = 단지별 사다리 3 horizon(C1 overlay), gaps = 단지별 가격 갭(C2 나란히), terms = TermsTable(전매·거주·계약금·자기자본), decisions = 시나리오 code(또는 id 문자열)별 decide 결과(C7, DecisionPanel). ladders·gaps의 키는 complex_id 문자열.
      type: object
      additionalProperties: false
      required:
      - snapshot_id
      - asof_date
      - scenario_id
      - ids
      - rows
      - components
      - ladders
      - gaps
      - terms
      - decisions
      properties:
        snapshot_id:
          type: integer
        asof_date:
          type: string
          format: date
        scenario_id:
          type: integer
        ids:
          x-nonfact: 식별자 목록(complex_id)
          type: array
          minItems: 2
          maxItems: 6
          items:
            type: integer
        rows:
          type: array
          items:
            $ref: '#/components/schemas/ScoreRow'
        components:
          title: ComponentMatrix
          type: object
          additionalProperties: false
          required:
          - weights
          - keys
          properties:
            weights:
              $ref: '#/components/schemas/Weights'
            keys:
              type: array
              items:
                $ref: '#/components/schemas/ComponentKey'
        ladders:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/LadderRow'
        gaps:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Gap'
        terms:
          type: array
          items:
            $ref: '#/components/schemas/TermsRow'
        decisions:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/DecisionSet'
      examples:
      - snapshot_id: 12
        asof_date: '2026-10-08'
        scenario_id: 3
        ids:
        - 2
        - 7
        rows: []
        components:
          weights:
            p10: 0.3
            rerank: 0.15
            gap: 0.2
            benchmark: 0.1
            supply: 0.1
            liquidity: 0.15
          keys:
          - p10
          - rerank
          - gap
          - benchmark
          - supply
          - liquidity
        ladders: {}
        gaps: {}
        terms: []
        decisions: {}
    Competition:

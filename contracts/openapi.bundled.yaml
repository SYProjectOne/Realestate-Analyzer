    ScoreComponent:
      title: ScoreComponent
      description: |-
        구성 점수 1개 (RA §3 score_component, §6-4). (score_run_id, complex_id, component) 유일. formula_text는 식을 값으로 채운 문자열이고 화면 툴팁에 그대로 보인다(빈 문자열 금지).
        식(각 0~10):
        - p10 = 10 × P(+10%, policy.p10_horizon) — noul status가 review·escaped·error면 score_0_10=null, 종합 점수 미계산("미판정").
        - rerank = 10 × (N − rank)/(N − 1), 한 score_run의 값은 한 judgment_seq 호출에서만(§6-5). delta = 이전 run 대비 차이.
        - gap = clamp(5 − gap%/4, 0, 10), gap% = (P_mid − median(T_adj))/median(T_adj) × 100 (§6-2). 대체·보정이면 label 추정 reason '대체·보정 c=…'.
        - benchmark = clamp(10 × median(gain)/0.5, 0, 10), is_presale=false만. 표본 3 미만이면 reason '표본 n'.
        - supply = clamp(10 − 10 × U_window/U_ref, 0, 10) − pen (미분양 12개월 기울기>0 → 2, 준공 후 미분양 증가 → +1).
        - liquidity = clamp(10 − 2×Y_resale − 3×[거주의무>0] − D/5, 0, 10).
        - move_in = clamp(10 − 2×입주까지 연수, 0, 10) (A·D).
      type: object
      additionalProperties: false
      required:
      - complex_id
      - component
      - raw_value
      - score_0_10
      - formula_text
      - label
      properties:
        score_run_id:
          type:
          - integer
          - 'null'
        complex_id:
          type: integer
        component:
          $ref: '#/components/schemas/ComponentKey'
        raw_value:
          description: 식의 입력 원값(p10=확률, rerank=relevance, gap=gap%, benchmark=median gain, supply=U_window, liquidity=Y_resale, move_in=입주까지 연수)
          type:
          - number
          - 'null'
        score_0_10:
          type:
          - number
          - 'null'
          minimum: 0
          maximum: 10
        formula_text:
          type: string
          minLength: 1
        label:
          $ref: '#/components/schemas/Label'
        reason:
          type:
          - string
          - 'null'
        delta:
          description: rerank 성분의 delta_rerank(이전 run 대비 relevance 차). 다른 성분은 null
          type:
          - number
          - 'null'
        flags:
          description: '예: [''no_recent_sale_case'', ''substitute'']'
          type: array
          items:
            type: string
      examples:
      - score_run_id: 88
        complex_id: 4
        component: gap
        raw_value: 0.0
        score_0_10: 5.0
        formula_text: 'clamp(5 − 0.0/4, 0, 10) = 5.0 (P_mid 6.625억, 비교군 중앙 6.62억: 리버시티 +0~+20 / 센트럴자이 −10~−20 혼재)'
        label: 추정
        reason: 대체·보정 c=0.015
        delta: null
        flags:
        - substitute
      - score_run_id: 88
        complex_id: 2
        component: rerank
        raw_value: 0.89
        score_0_10: 8.9
        formula_text: '보고서 (a)단계: relevance 0.89 × 10 = 8.9 (jl_124)'
        label: 추정
        reason: null
        delta: -0.02
        flags: []
    ScoreInputs:
      title: ScoreInputs
      description: |-
        ScoreEngine.run(snapshot, scenario, inputs)의 입력 (RA §4-3, §6). DB에서 읽어 만드는 쪽은 WP7(scheduler)·WP5, 계산은 WP4(analysis)가 순수 함수로 한다 — 같은 inputs면 같은 결과.
        판정 값은 봉투 형태 그대로(status·judgment_seq 포함) 넣고, status가 ok가 아닌 값을 걸러내는 것은 WP4다.
        비교군 선택(같은 생활권, 준공 2020년 이후, 전용 80~85㎡, 기준일 이전 6개월, cancelled=false, Open API 우선, 3건 미만이면 대체, 이상치 1.5×IQR 제외)도 WP4의 규칙이므로 trades에는 생활권의 거래를 걸러내지 않고 넣는다.
        fixed_components는 회귀 (a)단계 전용(RA §9): 주어진 성분은 식을 건너뛰고 그 점수를 그대로 쓴다(formula_text '고정 입력: <출처>').

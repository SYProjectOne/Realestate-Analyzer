              - 확인 불가
              - 불가
    HumanCheckField:
      title: HumanCheckField
      description: '사람 확인 대상(계약 2026-10-09.8, D11-3·M-5): 강등 가능한 사실 필드 5개(max_price_won = 기준 타입 최고 공급금액 — 현재 공고 가격 행, move_in_ym = 입주 예정 YYYY-MM, resale_months·residency_months = 개월 0~240 정수, down_payment_pct = 현재 납부 조건 계약금 % 0~100) + **discount**(계약 .13, D16-1 — 기준 타입 할인 원 단위 정수 0~1천억, 단위 ''원''만. 현재 공고 payment_terms.discount_by_type.<기준 타입>에 라벨 확인됨으로 들어가 구매가에서 빠진다(0 = 할인 없음 확인). 공고문 파서 할인은 언제나 ''추정''이라 이 사람 확인만 차감을 만든다. 의미 단위(D13-2) — 그 단지 다른 공고의 같은 타입 할인 칸에도 퍼진다) + intake_status(접수 상태) + other(기록만, 사실 변경 없음). 값은 필드 형·범위 검사를 통과해야 한다(정수 필드에 ''6.02'' → 422).'
      type: string
      enum:
      - intake_status
      - max_price_won
      - move_in_ym
      - resale_months
      - residency_months
      - down_payment_pct
      - discount
      - other
    InclusionClass:
      title: InclusionClass
      description: 포함/제외 분류. 판정기 classify 7클래스(사업주체 명의 기준) + '범위 경계'(DECISIONS D2-6) + '미분류'. private_sale_apt만 포함; review면 포함하되 미해결 표기(meta §1-3-3).
      type: string
      enum:
      - private_sale_apt
      - public_sale
      - public_rental
      - private_rental
      - non_apartment
      - out_of_scope
      - manual_review
      - 범위 경계
      - 미분류
    Intake:
      title: Intake
      description: |-
        접수 가능 상태 1건 (intake_status 행의 API 모양, RA §4-1). 같은 스냅샷에 path별 행이 여러 개일 수 있고, 표시값은 우선순위 human_check > official_popup > headless_shot 으로 고른다. unofficial_ref 는 참고 열에만 쓰고 판정(요건 사전 계산·후보 필터)에 쓰지 않는다 — unofficial_ref 는 status='가능'이 될 수 없다.
        표시 문자열: status='확인 불가'이면 '확인 불가(<reason>, <checked_at 날짜>)' (예: '확인 불가(403, 2026-10-07)'). path=human_check이면 배지에 '사람' 접두어.
      type: object
      additionalProperties: false
      required:
      - status
      - path
      - checked_at
      properties:
        id:
          description: intake_status.id
          type:
          - integer
          - 'null'
        complex_id:
          type:
          - integer
          - 'null'
        snapshot_id:
          type:
          - integer
          - 'null'
        status:
          description: 가능 / 미정 / 확인 불가 / 불가
          type: string
          enum:
          - 가능
          - 미정
          - 확인 불가
          - 불가
        path:
          description: 근거 경로. human_check(전화·방문) > official_popup(공식 홈페이지 팝업) > headless_shot(헤드리스 렌더 스크린샷) > unofficial_ref(언론·블로그, 판정 미사용)
          type: string
          enum:

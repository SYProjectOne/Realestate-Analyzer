components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        API_TOKEN(쓰기 포함 전부), READONLY_TOKEN(GET만, 운영자 열람용 고정 토큰) 또는 공유 링크 토큰(POST /share-links 가 발급, GET만, 만료 30일 = SHARE_TOKEN_TTL_DAYS — 만료·회수되면 401). 읽기 전용 토큰·공유 링크 토큰으로 GET 이외 메서드를 부르면 403 forbidden.
        두 환경 토큰(API_TOKEN·READONLY_TOKEN)이 모두 비면(개발 기본값) 인증 없이 열지만 루프백(127.0.0.1·::1) 접속만 받는다(그 밖 401) — 서버도 127.0.0.1 에만 바인드한다(app.serve). ENV=prod 는 API_TOKEN 필수.
        D10-7(계약 2026-10-09.6): 공유 링크 토큰은 화면 조회 GET 만 — `/ops/*`·`/jobs`·`/jobs/*` 는 GET 이라도 403 forbidden(운영 화면·잡 큐는 공유 범위 밖). READONLY_TOKEN 은 모든 GET.
  parameters:
    RegionId:
      name: id
      in: path
      required: true
      schema:
        type: integer
    SnapshotId:
      name: sid
      in: path
      required: true
      schema:
        type: integer
    ComplexId:
      name: id
      in: path
      required: true
      schema:
        type: integer
    SnapshotQuery:
      name: snapshot
      in: query
      required: false
      description: 기준일 스냅샷 id. 생략 시 최신 published.
      schema:
        type: integer
    Scenario:
      name: scenario
      in: query
      required: false
      description: 내장 code(base|A|B|C|D) 또는 사용자 시나리오 id. 생략 시 base.
      schema:
        type: string
        pattern: ^(base|A|B|C|D|[0-9]+)$
        default: base
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    Size:
      name: size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 50
    Since:
      name: since
      in: query
      required: false
      description: ISO 날짜(YYYY-MM-DD) 또는 시각. 이 시점 이후.
      schema:
        type: string
        minLength: 10
        maxLength: 32
    ComplexSort:
      name: sort
      in: query
      required: false
      description: 정렬 키, 앞에 '-'면 내림차순. 기본 '-total'(동점은 complex_id).
      schema:
        type: string
        pattern: ^-?(total|rank|name|price_mid|price_low|move_in_ym|resale_end|gap_pct|p10|living_area|last_change)$
        default: -total
    ComplexFilter:
      name: filter
      in: query
      required: false
      description: |
        G2 FilterBar. deepObject: `filter[living_area]=la_2&filter[intake_status]=가능&filter[price_max]=700000000`.
        living_area·intake_status·land_type·inclusion_class·judge_scope는 쉼표로 여러 값.
      style: deepObject
      explode: true
      schema:
        type: object
        additionalProperties: false
        properties:
          living_area:
            type: string
          intake_status:
            type: string
          land_type:
            type: string
          inclusion_class:
            type: string
          judge_scope:
            type: string
          resale_end_before:
            type: string
            format: date
          price_min:
            type: integer
            minimum: 0
          price_max:
            type: integer
            minimum: 0
          move_in_year:
            type: integer
            minimum: 2000
            maximum: 2100
          q:
            type: string
            maxLength: 50
  responses:
    Unauthorized:
      description: 토큰 없음·불일치
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            unauthorized:
              summary: 토큰 없음
              value:
                code: unauthorized
                detail: missing or invalid bearer token
    Forbidden:
      description: 읽기 전용 토큰으로 GET 이외 호출
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            readonly:
              summary: 읽기 전용 토큰으로 쓰기
              value:
                code: forbidden
                detail: read-only token may only call GET
    NotFound:
      description: 리소스 없음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            notFound:
              summary: 없는 리소스
              value:
                code: not_found
                detail: complex 999 not found
    ValidationError:
      description: 요청 검증 실패
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalid:
              summary: 요청 검증 실패
              value:
                code: validation_error
                detail: request body failed validation
                field_errors:
                - loc:
                  - body
                  - weights
                  msg: weights must sum to 1 (got 1.05)
    InternalError:
      description: contract_violation(출처 없는 수치, dev — 발행 전 리비전 실시간 GET), stored_view_mismatch(발행 리비전 저장본의 sha256·계약 버전 불일치 — 계약 .11 D14-4, 조용히 내보내지 않는다) 또는 internal
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            contractViolation:
              summary: 출처 없는 수치(dev)
              value:
                code: contract_violation
                detail: complex 4 field max_price_won has no field_provenance row
    MaterializePending:
      description: |
        계약 2026-10-09.11(D14-9): 발행 리비전인데 그 화면의 저장본을 아직 만들지 않았다(0010 이전 발행분·.11 새 종류 — worker 시작·
        `python -m app.snapshot_view backfill` 이 채운다). code = materialize_pending, Retry-After 헤더(초). 실시간 폴백 없음 — 잠시 뒤 다시.
      headers:
        Retry-After:
          schema:
            type: integer
          description: 다시 시도할 때까지 초
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            pending:
              summary: 계약 .11 — 저장본 생성 전(backfill 대기)
              value:
                code: materialize_pending
                detail: 발행 리비전 12 의 provenance 저장본을 아직 만들지 않았다(backfill 대기 — 잠시 뒤 다시)
    JudgeUnavailable:
      description: 판정기 장애(degraded) — 판정기가 꼭 필요한 동작만. 조회는 계속된다
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            degraded:
              summary: 판정기 장애
              value:
                code: judge_unavailable
                detail: judge adapter unavailable (degraded mode); collection and reads continue
  schemas:
    AgePremiumCoef:
      title: AgePremiumCoef
      description: 연식 보정 T_adj = T × (1 + c × min(Y_ref − Y_built, cap_years)) (RA §6-2). 라벨은 항상 추정.
      type: object
      additionalProperties: false
      required:
      - c_per_year
      - cap_years
      - label
      properties:
        c_per_year:
          x-nonfact: 지역 설정값(연식 보정 계수 가정 — region.age_premium_coef, 출처 데이터 아님)
          type: number
          minimum: 0
          maximum: 0.1
          default: 0.015
        cap_years:
          x-nonfact: 지역 설정값(연식 보정 상한 연수 가정)
          type: integer
          minimum: 0
          maximum: 30
          default: 8
        label:
          const: 추정
    ApplyhomeQuery:
      title: ApplyhomeQuery
      description: |-
        청약홈 조회 파라미터(collectors/applyhome 이 읽는다, 2026-10-09.2에 키 정의). 모든 키 선택:
        - from_ym: 목록 조회 시작월 'YYYY-MM'(없으면 기준월 −10개월). 끝은 기준월 +1개월, 12개월 창으로 나눠 조회.
        - areas: {시도 코드 2자리: 청약홈 지역 약칭('서울'·'경기'·'인천' …)} — 없으면 legal_dong.sido_name(또는 selections 첫 토큰)에서 행정구역 접미사를 떼어 만든다.
        그 밖의 키는 수집기가 무시한다(이전 예시의 sido_codes 등 — 조회 시도는 region.sido_codes).
      type: object
      additionalProperties: true
      properties:
        from_ym:
          type:
          - string
          - 'null'
          pattern: ^[0-9]{4}-[0-9]{2}$
        areas:
          type: object
          additionalProperties:
            type: string
    AuditResult:
      title: AuditResult
      description: P3 감사. flagged 항목은 원문 대조 후 수정.
      type: object
      required:
      - verdict
      - items
      properties:
        verdict:
          type: string
          enum:
          - pass
          - flagged
        items:
          type: array
          items:
            title: AuditItem
            type: object
            required:
            - field
            - p_wrong
            - flagged
            properties:
              field:
                type: string
              p_wrong:
                description: 틀렸을 확률 0~1. 판정기가 주지 않았으면 null(0·1로 지어내지 않는다) — 2026-10-09.2
                type:
                - number
                - 'null'
              flagged:
                type: boolean
              note:
                type:
                - string
                - 'null'
    BackupPayload:
      title: BackupPayload
      description: 'job_name=''backup'' 페이로드 (DECISIONS D11-8, 계약 2026-10-09.8). worker 가 매일 03:00 넣는다(수동 POST /jobs 도 가능). DB 백업(Postgres = pg_dump custom 형식, SQLite 개발 모드 = 온라인 백업 파일 복사) + 원문(RAW_DIR) 증분 복사(이전 백업 뒤 바뀐 파일만)를 BACKUP_DIR/<날짜>/ 에 남기고(compose 는 별도 볼륨 backups:/backups — D12-6), 결과(파일·크기·sha256·복사 수·실패 사유)는 job_run.stats 에. 페이로드는 빈 객체(또는 keep_days — 보존 일수, 기본 무기한: RA 보존 정책 ''삭제 없음'').'
      type: object
      additionalProperties: false
      properties:
        keep_days:
          x-nonfact: 운영 설정값(보존 일수)
          description: 이 일수보다 오래된 백업 폴더를 지운다(없으면 지우지 않는다 — 보존 무기한)
          type:
          - integer
          - 'null'
          minimum: 1
          maximum: 3650
      examples:
      - {}
    BenchmarkAbsence:
      title: BenchmarkAbsence
      description: |-
        벤치마크 없음 사유(D9-2 '그래도 0 → 종합 미계산 + 사유 표시', R3 재리뷰 N-M3, 계약 2026-10-09.6). 지역에 점수에 쓸 벤치마크 행(분양권 제외)이 하나도 없을 때만 객체, 있으면 null. 화면(G1·G6)·보고서 표시 = '벤치마크 없음(<reason>)'. 이때 benchmark 성분은 미계산이고 종합 점수도 미계산이다(RA §6-4).
        - code: not_collected = 지역 실거래(rtms)가 아직 없다(수집 전) · presale_only = 분양권 거래(입주 전) 사례만 있어 점수에서 제외 · no_sample = 실거래는 있으나 입주 후 실거래가 있는 과거 분양 사례가 생활권·지역 전체 모두 0.
        - reason: 표시 문자열(한국어).
      type: object
      additionalProperties: false
      required:
      - code
      - reason
      properties:
        code:
          type: string
          enum:
          - not_collected
          - presale_only
          - no_sample
        reason:
          type: string
          minLength: 1
    BenchmarkInput:
      title: BenchmarkInput
      type: object
      additionalProperties: false
      required:
      - living_area
      - name
      - sale_year
      - sale_price_84_won
      - trade_median_won
      - is_presale
      - label
      properties:
        id:
          type:
          - integer
          - 'null'
        living_area:
          type:
          - string
          - 'null'
        name:
          type: string
        completed_year:
          type:
          - integer
          - 'null'
        sale_year:
          type:
          - integer
          - 'null'
        sale_price_84_won:
          type:
          - integer
          - 'null'
        trade_median_won:
          type:
          - integer
          - 'null'
        is_presale:
          type: boolean
        substitute:
          description: '지역 전체 대체 행(D9-2: 생활권 자체 표본 0 → 지역 전체 표본 복사, 라벨 추정) — DB benchmark.substitute(계약 2026-10-09.7, 0007). 점수 엔진은 쓴 행이 대체면 식에 ''대체(지역 전체)''·라벨 ''추정''(N-M4). note 문자열로 판별하지 않는다'
          type: boolean
          default: false
        label:
          $ref: '#/components/schemas/Label'
    BenchmarkView:
      title: BenchmarkView
      description: '벤치마크 1개(C3 dumbbell 1행): 분양가 → 최근 실거래 범위, 고점 마커. gain_* = (실거래 − 분양가)/분양가(%), annualized_pct = 분양 연도부터 연율. is_presale=true(분양권)는 별도 마커이고 benchmark 점수에서 제외.'
      type: object
      additionalProperties: false
      required:
      - id
      - snapshot_id
      - substitute
      - living_area
      - name
      - completed_year
      - sale_year
      - sale_period
      - sale_price_84_won
      - trade_low_won
      - trade_median_won
      - trade_high_won
      - trade_window
      - peak_won
      - peak_ym
      - is_presale
      properties:
        id:
          type: integer
        snapshot_id:
          description: 이 행을 조립한 스냅샷(계약 2026-10-09.6, G1 요청 — 재조립이 발행 스냅샷이 인용한 행을 지우지 않게). null = 0006 이전 행·사람 입력(모든 스냅샷에 보인다).
          type:
          - integer
          - 'null'
        substitute:
          description: 지역 전체 표본을 이 생활권 대체로 복사한 행(D9-2, 라벨 추정, 표시 '대체(지역 전체)'). 자기 표본 sample_n 에 세지 않는다. 값 = DB benchmark.substitute 컬럼(계약 2026-10-09.7 — note 문자열 판별 대신).
          type: boolean
        living_area:
          type:
          - string
          - 'null'
        name:
          type: string
        completed_year:
          x-nonfact: 연도 분류·축 키(값의 근거는 같은 행의 Fact·출처)
          type:
          - integer
          - 'null'
        sale_year:
          x-nonfact: 연도 분류·축 키(값의 근거는 같은 행의 Fact·출처)
          type:
          - integer
          - 'null'
        sale_period:
          type:
          - string
          - 'null'
          enum:
          - 저가 분양기
          - 고가 분양기
          - null
        sale_price_84_won:
          $ref: '#/components/schemas/Fact'
        trade_low_won:
          $ref: '#/components/schemas/Fact'
        trade_median_won:
          $ref: '#/components/schemas/Fact'
        trade_high_won:
          $ref: '#/components/schemas/Fact'
        trade_window:
          type:
          - string
          - 'null'
        n_trades:
          x-nonfact: 벤치마크 근거 실거래 표본 수(집계 메타)
          type:
          - integer
          - 'null'
        peak_won:
          $ref: '#/components/schemas/Fact'
        peak_ym:
          $ref: '#/components/schemas/Fact'
        is_presale:
          type: boolean
        gain_low_pct:
          anyOf:
          - $ref: '#/components/schemas/Fact'
          - type: 'null'
        gain_high_pct:
          anyOf:
          - $ref: '#/components/schemas/Fact'
          - type: 'null'
        annualized_pct:
          anyOf:
          - $ref: '#/components/schemas/Fact'
          - type: 'null'
        note:
          type:
          - string
          - 'null'
    CatalystCreate:
      title: CatalystCreate
      description: POST /catalysts 본문 — 사람이 넣는 호재 URL(DECISIONS D1-6, 계약 2026-10-09.4). 서버는 normalize.catalyst 의 공개 함수로 catalyst 후보 행(stage '미확정', location_confirmed=false, catalyst_link 없음, 출처 행 = 이 URL)을 만들고, 분류(kind·stage)는 판정기 classify 가 한다 — 지역 최신 스냅샷에 rejudge 잡(complex_ids=[] → P4 호재 classify + 점수 재계산)을 등록한다. url 은 http(s)만(공개 페이지). 판정은 하지 않는다(규칙 3).
      type: object
      additionalProperties: false
      required:
      - region_id
      - url
      - title
      properties:
        region_id:
          type: integer
        url:
          type: string
          minLength: 10
          maxLength: 2000
          pattern: ^https?://[^\s/]+(/[^\s]*)?$
        title:
          type: string
          minLength: 1
          maxLength: 200
        excerpt:
          description: 기사·공고 발췌(사람이 붙여 넣은 공개 문장, 개인정보 금지 — guard 통과)
          type:
          - string
          - 'null'
          maxLength: 2000
    CatalystCreated:
      title: CatalystCreated
      description: POST /catalysts 201 — 만든 호재 후보(CatalystView, stage '미확정')와 등록한 분류 잡(지역에 스냅샷이 없으면 null — 다음 파이프라인 P4 가 분류한다).
      type: object
      additionalProperties: false
      required:
      - catalyst
      - job
      - job_id
      properties:
        catalyst:
          $ref: '#/components/schemas/CatalystView'
        job:
          description: 새 후보를 분류할 rejudge 잡(점수 재계산 — 대상 단지 0개, 판정 뒤 snapshot.publish 로 새 리비전 발행). 같은 URL 이 이미 있거나 지역에 스냅샷이 없으면 null
          anyOf:
          - $ref: '#/components/schemas/JobRun'
          - type: 'null'
        job_id:
          description: '계약 .12(D15-6, R3 7차 m16): job.id(없으면 null) — 발행을 일으키는 쓰기 응답의 공통 이름. 화면은 이 잡을 감시한다'
          type:
          - integer
          - 'null'
    CatalystLinkView:
      title: CatalystLinkView
      description: 'catalyst_link 1행(계약 .8): 단지·거리(좌표 없으면 null)·가중치·라벨·근거'
      type: object
      additionalProperties: false
      required:
      - complex_id
      - distance_m
      - weight
      - label
      - reason
      properties:
        complex_id:
          type: integer
        distance_m:
          x-nonfact: 연결 계산값(단지 좌표가 없으면 null — 출처 = 사람 위치 확인)
          type:
          - integer
          - 'null'
        weight:
          x-nonfact: §6 수식의 호재 가중치 상수(가정 — 출처 데이터 아님)
          type:
          - number
          - 'null'
        label:
          $ref: '#/components/schemas/Label'
        reason:
          type:
          - string
          - 'null'
    CatalystPatch:
      title: CatalystPatch
      description: 'PATCH /catalysts/{id} 본문 — 사람이 위치를 확인하고 영향 범위를 지정한다(DECISIONS D11-5, 계약 2026-10-09.8). location_confirmed=true 면 catalyst_link 를 만든다: complex_ids(단지 직접 지정) + living_area_ids(그 생활권의 지역 단지 전부). 단지 좌표가 없으므로 distance_m=null, weight=1, 라벨 추정(reason ''같은 생활권'' 또는 ''사람 지정''). false 면 연결을 모두 지운다(RA: 위치 미확정 = 연결 없음). expected_ym 은 사람이 확인한 완공·개통 예정월(출처 = 사람 확인), null 이면 지운다. lat·lon 은 유한한 숫자(NaN·무한대 422). ''호재 아님'' 후보는 location_confirmed=true 422. 연결이 바뀌면 판정·점수에 쓰지 않는 값이라 rejudge 없이 새 리비전을 바로 발행해 그 시점 연결을 얼린다(계약 .9, D12-4 — 응답 job 은 null).'
      type: object
      additionalProperties: false
      required:
      - location_confirmed
      properties:
        location_confirmed:
          type: boolean
        lat:
          type:
          - number
          - 'null'
          minimum: -90
          maximum: 90
        lon:
          type:
          - number
          - 'null'
          minimum: -180
          maximum: 180
        living_area_ids:
          type:
          - array
          - 'null'
          items:
            type: string
            maxLength: 64
          maxItems: 50
        complex_ids:
          type:
          - array
          - 'null'
          items:
            type: integer
          maxItems: 1000
        expected_ym:
          type:
          - string
          - 'null'
          pattern: ^[0-9]{4}-(0[1-9]|1[0-2])$
    CatalystUpdated:
      title: CatalystUpdated
      description: PATCH /catalysts/{id} 202(계약 .11) — 갱신한 호재 + 연결 목록 + 등록한 발행 잡(연결이 그대로면 null)
      type: object
      additionalProperties: false
      required:
      - catalyst
      - links
      - job
      - job_id
      properties:
        catalyst:
          $ref: '#/components/schemas/CatalystView'
        links:
          type: array
          items:
            $ref: '#/components/schemas/CatalystLinkView'
        job:
          description: '계약 .11(D14-5): 연결이 바뀌면 snapshot.publish 잡(새 리비전에 파생 행 복사 → 발행 — 판정기 호출 없음), 그대로면 null. 잡이 끝날 때까지 이전 발행 리비전이 기본 화면이다'
          anyOf:
          - $ref: '#/components/schemas/JobRun'
          - type: 'null'
        job_id:
          description: '계약 .11: job.id(없으면 null) — 화면은 이 잡을 감시한다'
          type:
          - integer
          - 'null'
    CatalystView:
      title: CatalystView
      description: |-
        호재 1건의 화면 표현 (RA §3 catalyst + catalyst_link) — C9 보드·타임라인, G3 CatalystList. stage는 판정기 classify 결과(review면 '미확정'). location_confirmed=false면 단지 연결 없음(catalyst_link 행 없음, 점수 가중치 0, '연결 없음' 표시). 미확정·언론은 회색. 타임라인에는 stage='확정'인 것만 expected_ym으로 그린다.
        ComplexDetail.catalysts에서는 그 단지와의 연결(linked, distance_m, weight)이 채워지고, Market.catalysts에서는 linked_complex_ids가 채워진다.
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - kind
      - stage
      - stage_prob
      - expected_ym
      - location_confirmed
      - decision
      - judgment_seq
      properties:
        id:
          type: integer
        name:
          type: string
        kind:
          type: string
          enum:
          - 교통
          - 개발
          - 학교
          - 상업
          - 생활인프라
          - 기타
        stage:
          description: 판정기 classify 단계. '호재 아님'(계약 2026-10-09.8, D11-2) = 판정기가 호재가 아니라고 본 뉴스 후보 — 지우지 않고 제외로 남긴다(목록·보드에서 '호재 아님' 배지, 점수·타임라인 제외). 사람이 넣은 호재는 단계가 바뀌지 않고 판정 결과가 note 에 병기된다
          type: string
          enum:
          - 확정
          - 계획
          - 추진
          - 언론
          - 미확정
          - 호재 아님
        stage_prob:
          $ref: '#/components/schemas/Fact'
        decision:
          type:
          - string
          - 'null'
          enum:
          - auto
          - review
          - manual_review
          - null
        expected_ym:
          $ref: '#/components/schemas/Fact'
        location_confirmed:
          type: boolean
        linked:
          type:
          - boolean
          - 'null'
        distance_m:
          anyOf:
          - $ref: '#/components/schemas/Fact'
          - type: 'null'
        weight:
          x-nonfact: §6 수식의 호재 가중치 상수(가정 — 출처 데이터 아님)
          type:
          - number
          - 'null'
        linked_complex_ids:
          type:
          - array
          - 'null'
          items:

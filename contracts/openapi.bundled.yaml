          type:
          - integer
          - 'null'
        scenario_id:
          type:
          - integer
          - 'null'
        option_key:
          type: string
          enum:
          - complex
          - wait_new
          - ask_user
          - investigate
          - none
        complex_id:
          type:
          - integer
          - 'null'
        label:
          description: 표시 이름(단지명 또는 '모집공고 대기' 등)
          type: string
        prob:
          $ref: '#/components/schemas/Fact'
        chosen:
          type: boolean
        tie:
          type: boolean
        mismatch:
          type: boolean
        confidence:
          x-nonfact: 판정기 봉투 원값(G7 판정 로그 표시 전용) — 화면의 확률·순위는 Fact(jl_<seq>)로 따로 낸다
          type:
          - number
          - 'null'
          minimum: 0
          maximum: 1
        requirements:
          anyOf:
          - $ref: '#/components/schemas/RequirementChecks'
          - type: 'null'
        judgment_seq:
          type:
          - integer
          - 'null'
      examples:
      - id: 4402
        score_run_id: 90
        scenario_id: 3
        option_key: complex
        complex_id: 7
        label: 김포 칸타빌 에디션
        prob:
          v: 0.54
          label: 추정
          reason: 판정기 decide
          prov: jl_127
          checked_at: '2026-10-07'
          unit: prob
        chosen: true
        tie: true
        mismatch: false
        confidence: 0.48
        requirements:
          access:
            pre:
              status: 충족
              evidence: 접수 가능(공식 팝업 2026-10-07, 선착순 동·호지정) → 충족
            judge: supported
            mismatch: false
          regulation:
            pre:
              status: 충족
              evidence: 거주의무 0개월, 재당첨 제한 없음 → 충족
            judge: supported
            mismatch: false
          funds:
            pre:
              status: 충족
              evidence: 계약금 3,403만(5%) ≤ 자기자본 2억; 잔금 부족 0 → 충족 (중도금 이자후불제)

    Market:
      title: Market
      description: GET /snapshots/{sid}/market — G6 지역 시장 (RA §4-2, §7-2 C3·C4·C5·C9). 벤치마크(C3), 입주 물량(C4, 생활권 스택 + 판정 단지 입주월 마커), 미분양(C5, 24개월 2계열, 결측 월은 v=null — connectNulls=false), 호재(C9), 규제 요약 카드, 생활권별 비교 시세 표.
      type: object
      additionalProperties: false
      required:
      - snapshot_id
      - asof_date
      - region_id
      - living_areas
      - benchmarks
      - benchmark_flags
      - benchmark_absence
      - supply
      - move_in_markers
      - unsold
      - catalysts
      - regulation
      - living_area_prices
      properties:
        snapshot_id:
          type: integer
        asof_date:
          type: string
          format: date
        region_id:
          type: integer
        living_areas:
          type: array
          items:
            title: LivingAreaRef
            type: object
            additionalProperties: false
            required:
            - id
            - name
            properties:
              id:
                type: string
              name:
                type: string
        benchmarks:
          type: array
          items:
            $ref: '#/components/schemas/BenchmarkView'
        benchmark_absence:
          anyOf:
          - $ref: '#/components/schemas/BenchmarkAbsence'
          - type: 'null'
        benchmark_flags:
          type: array
          items:
            title: BenchmarkFlag
            description: |-
              생활권별 벤치마크 표본 경고: sample_n < 3 → '표본 n, 추정' 배지; no_recent_sale_case = 최근 3년 분양 사례 0건(자기 생활권 표본 기준).
              - sample_n: **자기 생활권 표본만**(분양권·지역 전체 대체 행 제외 — R3 재리뷰 N-M4, 계약 2026-10-09.6). 대체 행까지 세면 '표본 3 미만' 배지가 빠진다.
              - substituted: 자기 표본 0 → 지역 전체 표본을 대체로 보인다(D9-2, 라벨 추정, 표시 '대체(지역 전체)').
            type: object
            additionalProperties: false
            required:
            - living_area
            - sample_n
            - no_recent_sale_case
            - substituted
            properties:
              living_area:
                type: string
              sample_n:
                type: integer
                minimum: 0
                x-nonfact: 자기 생활권 벤치마크 행 개수(집계 메타)
              no_recent_sale_case:
                type: boolean
              substituted:
                type: boolean
        supply:
          type: array
          items:
            $ref: '#/components/schemas/SupplyPoint'
        move_in_markers:
          type: array
          items:
            title: MoveInMarker
            type: object
            additionalProperties: false
            required:
            - complex_id
            - name
            - living_area
            - move_in_ym

    Claim:
      title: Claim
      description: |-
        원자 주장 1건 (RA §3 claim, §4-3 ClaimSplitter). 1 사실 = 1 주장: 접속사·열거를 나누고, 숫자가 2개 이상이면 분할한다("3개는 unlikely이고 나머지는 uncertain" → 2개 이상, T6). 복합 문장을 그대로 verify에 보내지 않는다.
        contradicted가 남으면 그 스냅샷은 published 불가. contradicted 주장은 문장을 고쳐 다시 나눈 새 주장(parent_claim_id로 연결)으로 재검증한다(같은 입력 재호출 아님).
      type: object
      additionalProperties: false
      required:
      - snapshot_id
      - section
      - complex_id
      - text
      - evidence_text
      - verify_status
      - judgment_seq
      properties:
        id:
          type:
          - integer
          - 'null'
        snapshot_id:
          type:
          - integer
          - 'null'
        section:
          description: 보고서 섹션 키(예 '6', '7-2', '8-1', '12-4')
          type: string
          maxLength: 32
        complex_id:
          type:
          - integer
          - 'null'
        text:
          type: string
          minLength: 1
        evidence_text:
          type:
          - string
          - 'null'
        verify_status:
          description: verify 전이면 null
          type:
          - string
          - 'null'
          enum:
          - verified
          - contradicted
          - unsupported
          - review
          - null
        judgment_seq:
          type:
          - integer
          - 'null'
        parent_claim_id:
          type:
          - integer
          - 'null'
        ordinal:
          description: 같은 원문에서 나온 순서
          type:
          - integer
          - 'null'
          minimum: 0
        entity:
          description: 주장이 생성된 DB 사실의 테이블(field_provenance.entity — complex·complex_type·payment_terms). P9 가 사실 문장에서 만든 주장만 채운다(계약 2026-10-09.6, D10-3). null = 사실에서 생성되지 않은 주장(보고서 문장 등)이거나 0006 이전 행.
          type:
          - string
          - 'null'
          maxLength: 32
        entity_id:
          description: 그 사실 행 id(field_provenance.entity_id).
          type:
          - integer
          - 'null'
        field:
          description: 그 사실 필드(field_provenance.field — move_in_ym·resale_months·residency_months·down_payment_pct·max_price_won 등).
          type:
          - string
          - 'null'
          maxLength: 64
      examples:
      - id: 7001
        snapshot_id: 12
        section: 12-4
        complex_id: 11
        text: 고촌센트럴자이의 +10% 이상 명제는 unlikely로 판정되었다.
        evidence_text: 'jev_noul #120: +10% 0.11 unlikely(auto)'
        verify_status: verified
        judgment_seq: 132
        parent_claim_id: 6990
        ordinal: 0
    ClaimPatch:
      title: ClaimPatch
      description: 'PATCH /claims/{id} 본문 — 사람이 고친 문장. 서버는 원 주장 행을 고치지 않고 claim.reverify 잡(payload = ClaimReverifyPayload)을 등록한다: worker 가 원자 주장으로 나눠 원 주장의 근거로 verify → parent_claim_id 로 연결된 새 주장 행. 원 주장이 contradicted 가 아니거나 이미 분할됐거나 같은 주장의 잡이 대기 중이면 409 conflict. 같은 대상만 허용한다(D10-3): 원자 주장마다 원 주장 field 의 용어(예 resale_months → ''전매'')가 있고 다른 사실 필드의 용어가 없어야 하며, 같은 지역의 다른 단지 이름만 가리키면 안 된다(문자열 대조, 판단 아님) — 어기면 422 validation_error(loc body.text). 원 주장이 DB 사실에서 생성됐으면 그 사실을 강등하고(FactDemotion: 값 비움·''확인 불가(검증 모순)''·체크리스트 ''사실 재확인''·rejudge 잡) 사람 확인 또는 새 원문이 오면 복원한다(D10-3, 계약 2026-10-09.6).'
      type: object
      additionalProperties: false
      required:
      - text
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 2000
    ClaimReverifyPayload:
      title: ClaimReverifyPayload
      description: job_name='claim.reverify' 페이로드 (계약 2026-10-09.4, RA §10 '스냅샷 published 안 됨' 대응). PATCH /claims/{id} 가 등록한다. worker 는 text 를 원자 주장으로 나눠(ClaimSplitter, T6) 원 주장의 근거로 verify 하고, 결과를 parent_claim_id=claim_id 인 새 주장 행으로 저장한다(같은 입력 재호출 아님 — 문장이 다르므로 input_hash 가 다르다). 원 주장 행은 고치지 않는다. 자식 주장이 생기면 원 주장은 '남은 contradicted' 가 아니다(judge.claims.remaining_contradicted) — 자식 중 contradicted 가 있으면 그것이 publish 를 막는다.
      type: object
      additionalProperties: false
      required:
      - snapshot_id
      - claim_id
      - text
      properties:
        snapshot_id:
          type: integer
        claim_id:
          description: 고칠 contradicted 주장 id(부모)
          type: integer
        text:
          description: 사람이 고친 문장(원자 분할 전)
          type: string
          minLength: 1
          maxLength: 2000
      examples:
      - snapshot_id: 12
        claim_id: 6990
        text: 고촌센트럴자이의 +10% 이상 명제는 unlikely로 판정되었다.
    ClaimView:
      title: ClaimView
      description: |-
        G7 주장 목록 1행 — GET /snapshots/{sid}/claims (계약 2026-10-09.4, RA §10 '스냅샷 published 안 됨' → contradicted 목록 표시 → 문장 수정 → 원자 분할 재검증).
        - remaining=true: 분할 재검증(자식 주장)이 없는 contradicted — 스냅샷 publish·보고서 생성을 막는 주장(judge.claims.remaining_contradicted 와 같은 규칙).
        - child_count: parent_claim_id 로 이 주장을 가리키는 자식 주장 수. pending_job_id: 이 주장의 claim.reverify 잡 중 queued·running 인 것(없으면 null) — 있으면 수정 버튼을 끈다.
        - prov: 판정 로그 출처(jl_<judgment_seq>, verify 전이면 null) — 출처 패널로 연다.
        - id·snapshot_id·complex_id·parent_claim_id·judgment_seq·ordinal·child_count·pending_job_id 는 비수치 메타(식별자·개수)다.
      type: object
      additionalProperties: false
      required:
      - id
      - snapshot_id
      - section
      - complex_id
      - complex_name
      - text
      - evidence_text
      - verify_status
      - judgment_seq
      - prov
      - parent_claim_id
      - ordinal
      - child_count
      - remaining
      - pending_job_id
      - entity
      - entity_id
      - field
      - field_name
      - demotion
      properties:
        id:
          type: integer
        snapshot_id:
          type: integer
        section:
          type: string
          maxLength: 32
        complex_id:
          type:
          - integer
          - 'null'
        complex_name:
          type:
          - string
          - 'null'
        text:
          type: string
        evidence_text:
          type:
          - string
          - 'null'
        verify_status:
          type:
          - string
          - 'null'
          enum:
          - verified
          - contradicted
          - unsupported
          - review
          - null
        judgment_seq:
          type:
          - integer
          - 'null'
        prov:
          type:
          - string
          - 'null'
          pattern: ^jl_[0-9]+$
        parent_claim_id:
          type:
          - integer
          - 'null'
        ordinal:
          type:
          - integer
          - 'null'
          minimum: 0
          x-nonfact: 같은 원문에서 나온 순서(정렬 키)
        child_count:
          type: integer
          minimum: 0
          x-nonfact: 자식 주장 개수(표시용 메타, 출처 데이터 아님)
        remaining:
          type: boolean
        pending_job_id:
          type:
          - integer
          - 'null'
        entity:
          description: 주장이 생성된 DB 사실의 테이블(field_provenance.entity — complex·complex_type·payment_terms). P9 가 사실 문장에서 만든 주장만 채운다(계약 2026-10-09.6, D10-3). null = 사실에서 생성되지 않은 주장(보고서 문장 등)이거나 0006 이전 행.
          type:
          - string
          - 'null'
          maxLength: 32
        entity_id:
          description: 그 사실 행 id(field_provenance.entity_id).
          type:
          - integer
          - 'null'
        field:
          description: 그 사실 필드(field_provenance.field — move_in_ym·resale_months·residency_months·down_payment_pct·max_price_won 등).
          type:
          - string
          - 'null'
          maxLength: 64
        field_name:
          description: field 의 표시 이름(예 '전매제한 기간'). 대상 없음이면 null.
          type:
          - string
          - 'null'
        demotion:
          anyOf:
          - $ref: '#/components/schemas/FactDemotion'
          - type: 'null'
    ClassifyItem:

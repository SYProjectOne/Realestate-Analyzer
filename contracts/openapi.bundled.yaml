    RegionCandidate:
      title: RegionCandidate
      description: |-
        GET /regions/resolve?q= 의 후보 1건 (DECISIONS D2-3). 자유 지명을 legal_dong·admin_dong 참조 테이블과 문자열 매칭한 결과다(판정기 호출 없음 — 문자열 매칭은 판단이 아님).
        매칭 규칙: 공백과 접미사 '시/군/구/동/읍/면'을 무시하고 이름 부분 일치. 정렬은 match(exact > prefix > partial) → kind(sido > sigungu > admin_dong > legal_dong) → full_name.
        legal_dong_codes는 이 후보를 고르면 region에 들어갈 법정동(10자리) 전체다. sido·sigungu 후보는 하위 법정동 전부, admin_dong 후보는 admin_legal_map으로 펼친 법정동이다. 폐지 코드(active=false)는 포함하지 않는다.
        분구·개편으로 옛 코드와 새 코드가 함께 active면 둘 다 후보로 나온다(DECISIONS D3). 공식 표에서 옛 코드가 폐지되면(예 2026-07 분구 후 서구 28260 폐지·검단구 28290 신설) 새 코드만 나온다.
      type: object
      additionalProperties: false
      required:
      - kind
      - code
      - full_name
      - legal_dong_codes
      - match
      properties:
        kind:
          type: string
          enum:
          - sido
          - sigungu
          - admin_dong
          - legal_dong
        code:
          description: sido 2자리, sigungu 5자리, admin_dong·legal_dong 10자리
          type: string
          pattern: ^[0-9]{2}([0-9]{3}([0-9]{5})?)?$
        full_name:
          type: string
        legal_dong_codes:
          type: array
          description: 법정동 코드 10자리 문자열
          items:
            type: string
        match:
          type: string
          enum:
          - exact
          - prefix
          - partial
        sigungu_code:
          type:
          - string
          - 'null'
          pattern: ^[0-9]{5}$
        sido_code:
          type:
          - string
          - 'null'
          pattern: ^[0-9]{2}$
      examples:
      - kind: legal_dong
        code: '2818510600'
        full_name: 인천광역시 연수구 송도동
        legal_dong_codes:
        - '2818510600'
        match: exact
        sigungu_code: '28185'
        sido_code: '28'
      - kind: sigungu
        code: '41570'
        full_name: 경기도 김포시
        legal_dong_codes:
        - '4157010100'
        - '4157010200'
        - '4157010300'
        - '4157010400'
        - '4157010500'
        - '4157025021'
        match: exact
        sigungu_code: '41570'
        sido_code: '41'
    RegionCreate:
      title: RegionCreate
      description: POST /regions 본문. 서버가 selections를 펼쳐 sido/sigungu/legal_dong 코드와 기본 생활권(시군구당 1개)을 만들고 region.bootstrap 잡을 등록한다.
      type: object
      additionalProperties: false
      required:
      - name
      - query_text
      - selections
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        query_text:
          type: string
        selections:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/RegionSelection'
    RegionCreated:
      title: RegionCreated
      description: 'POST /regions 201 응답: 만든 region + 등록된 region.bootstrap 잡 id'
      type: object
      additionalProperties: false
      required:
      - region
      - job_id
      properties:
        region:
          $ref: '#/components/schemas/Region'
        job_id:
          type: integer
    RegionExpandPayload:
      title: RegionExpandPayload
      description: 'job_name=''region.expand'' 페이로드 (DECISIONS D11-7, 계약 2026-10-09.8). PATCH /regions/{id} 가 넣는다(POST /jobs 로는 등록 불가 — JobCreateName). 지역 선택(selections)이 바뀐 뒤: 추가된 시군구·시도의 daily+weekly 수집 → 기준일 최신 리비전이 발행됐으면 새 리비전(revision_reason ''지역 확장'') → 후보 전체 판정·rerank 1회 → publish. 보고서는 이 리비전과 바탕 리비전(revision_of) 비교로 §12 ''지역 추가'' 장을 만든다.'
      type: object
      additionalProperties: false
      required:
      - region_id
      properties:
        region_id:
          type: integer
        added:
          description: 추가된 선택 [{kind, code, full_name}]
          type: array
          items:
            type: object
        removed:
          description: 제거된 선택 [{kind, code, full_name}]
          type: array
          items:
            type: object
        change_event_id:
          type:
          - integer
          - 'null'
      examples:
      - region_id: 1
        added:
        - kind: sigungu
          code: '41570'
          full_name: 경기도 김포시
        removed: []
        change_event_id: 3320
    RegionPatch:
      title: RegionPatch
      description: PATCH /regions/{id} 본문 — 지역 선택 확장·축소(DECISIONS D11-7 = RA '지역 추가', 계약 2026-10-09.8). selections 는 바뀐 뒤의 전체 목록(GET /regions/resolve 후보, 1개 이상). 서버는 법정동·시군구·시도 코드와 생활권(새 시군구는 새 생활권, 빠진 법정동은 생활권에서 제거 — 빈 생활권은 지운다)을 다시 계산하고 change_event(critical, entity=region, field=selections) + region.expand 잡(추가 선택 수집 → 새 리비전에서 후보 전체 판정·rerank 1회 → publish)을 등록한다. 바뀐 것이 없으면 409 conflict.
      type: object
      additionalProperties: false
      required:
      - selections
      properties:
        selections:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/RegionSelection'
        name:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 100
    RegionPatched:
      title: RegionPatched
      description: 'PATCH /regions/{id} 200: 갱신된 region + change_event + 등록된 region.expand 잡 id + 추가·제거된 선택. 이름만 바꾸면(선택 그대로) 판정 범위가 그대로라 change_event·job_id 가 null 이고 added·removed 는 빈 배열(계약 .9 — R3 4차 minor ''이름만 바꿔도 region.expand'')'
      type: object
      additionalProperties: false
      required:
      - region
      - change_event
      - job_id
      - added
      - removed
      properties:
        region:
          $ref: '#/components/schemas/Region'
        change_event:
          anyOf:
          - $ref: '#/components/schemas/ChangeEvent'
          - type: 'null'
        job_id:
          type:
          - integer
          - 'null'
        added:
          type: array
          items:
            $ref: '#/components/schemas/RegionSelection'
        removed:
          type: array
          items:
            $ref: '#/components/schemas/RegionSelection'
    RegionSelection:
      title: RegionSelection
      description: 사용자가 고른 후보 1개 (RegionCandidate의 kind·code·full_name)
      type: object
      additionalProperties: false
      required:
      - kind
      - code
      - full_name

          - 선착순
          - null
        effective_from:
          description: 이 조건이 적용되는 공고일 YYYY-MM-DD
          $ref: '#/components/schemas/Fact'
        down_payment_pct:
          $ref: '#/components/schemas/Fact'
        down_payment_first_won:
          description: 1차 계약금 정액(원). 정액 표기가 없으면 확인 불가
          $ref: '#/components/schemas/Fact'
        interim_pct:

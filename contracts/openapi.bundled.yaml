    Sensitivity:
      title: Sensitivity
      description: |-
        GET /snapshots/{sid}/sensitivity?scenario= — C10 민감도 (RA §6-6). 가중치 6개 각각 ±0.10을 주고(0~1로 자름) 나머지 5개를 원래 비율대로 재정규화해 합 1을 맞춘 12개 변형마다 종합 점수·순위를 다시 구한다: w_i' = clamp(w_i ± 0.10, 0, 1), w_j' = w_j × (1 − w_i')/(1 − w_i) (j≠i).
        TOP 5 집합 = rank ≤ 5 인 단지 전부(공동 5위 포함, 동점 규칙은 ScoreRunResult와 같음). 한 변형이라도 집합이 바뀌면 unstable=true, 들어오거나 나간 단지가 unstable_complex_ids(score_total.unstable=true). stable_components = 두 변형 모두 집합이 그대로인 성분(화면에서 회색).
        cells는 성분 순서(p10, rerank, gap, benchmark, supply, liquidity|move_in) × (+, −) 순 12개.

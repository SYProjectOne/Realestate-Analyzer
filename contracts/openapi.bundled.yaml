          - 'null'
        trustee:
          description: 신탁(수탁)사
          type:
          - string
          - 'null'
        builder:
          description: 시공사
          type:
          - string
          - 'null'
        housing_type:
          $ref: '#/components/schemas/Fact'
        land_type:
          $ref: '#/components/schemas/Fact'

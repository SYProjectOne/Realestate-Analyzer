          - restored
        label:
          type: string
          const: 확인 불가
        reason:
          type: string
          const: 검증 모순
        created_at:
          type: string
        restored_at:
          type:
          - string
          - 'null'
        restored_by:
          type:
          - string
          - 'null'
          enum:
          - human_check
          - new_source
          - null
        checklist_item_id:
          type:
          - integer
          - 'null'
        rejudge_job_id:
          type:
          - integer
          - 'null'
    FieldCandidate:
      title: FieldCandidate
      description: |-
        필드 값 후보 1개 (RA §4-3 Parser 출력). 원문 발췌(excerpt) 필수 — 출처 없는 숫자는 하나도 남기지 않는다.
        - entity/field: 저장 대상 테이블·컬럼(예 entity='complex_type', field='max_price_won'). 아직 행이 없으면 entity_id=null이고 entity_key로 식별(예 applyhome_id, 'applyhome_id:type_code').
        - value: 정규화 값(원 단위 정수, ㎡ 소수 2자리, ISO 날짜), value_text: 원문 표기 그대로.
        - source_rank: §3 출처 우선순위(1이 가장 높음). 세대수·면적·일정·경쟁률은 청약홈 상세(1) > 공고문(2) > 언론(3); 가격·발코니·옵션·납부·전매·거주의무는 공고문 최신(1) > 청약홈(2) > 언론(3).
        - primary: 1차 자료(청약홈·공고문·Open API·공식 홈페이지) 여부. 같은 source_rank의 1차 vs 1차 상충만 compare 대상(ResolvedFields 설명).
        - needs_extract: 정규식·표 파서가 실패해 판정기 extract로 넘길 필드.
        - entity='intake_status'(2026-10-09.2): 공식 홈페이지·팝업의 접수 상태 **문구 후보**. field='status_text', value=원문 문구(예 '선착순 동·호지정 계약 중'), entity_key='<단지 키>:<path>'(path = official_popup|headless_shot). 상태(가능/미정/불가) 분류는 판정기 classify 또는 사람 확인이 한다 — 파서는 정하지 않는다.
        - observed_on(2026-10-09.2): 원문이 말하는 시점(공고문의 입주자모집공고일, 통계 기준월의 말일 등) YYYY-MM-DD. checked_at(수집·확인일)과 다르다. 같은 source_rank에서 '공고문 최신'을 가르는 기준.
      type: object
      additionalProperties: false
      required:
      - entity
      - entity_id
      - field
      - value_text
      - value
      - source_rank
      - label
      - excerpt
      - raw_document_id
      properties:
        entity:
          type: string
          enum:
          - complex
          - complex_type
          - payment_terms
          - competition
          - remaining_event
          - intake_status
          - benchmark
          - rtms_trade
          - catalyst
          - supply
          - unsold
          - household_stat
        entity_id:
          type:
          - integer
          - 'null'
        entity_key:
          type:
          - string
          - 'null'
        field:
          type: string
          minLength: 1
          maxLength: 64

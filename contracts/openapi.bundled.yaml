    ShareLink:
      title: ShareLink
      description: |-
        읽기 전용 공유 링크 1건 (RA §10 보안 5 '공유 링크는 읽기 전용 토큰으로만, 만료 30일', ADR-9, 계약 2026-10-09.4).
        - 발급: POST /share-links(쓰기 토큰만). 서버가 무작위 토큰(32바이트 urlsafe)을 만들어 발급 응답(ShareLinkCreated.token)에서 한 번만 보여 준다 — DB 에는 sha256 만 저장(share_link.token_sha256), 목록·조회 응답에는 토큰이 없다.
        - 만료: expires_at = created_at + SHARE_TOKEN_TTL_DAYS(기본 30일). 만료·회수(revoked_at)된 토큰은 401 unauthorized.
        - 권한: 공유 토큰은 읽기 전용(GET 만, 그 밖 403 forbidden — READONLY_TOKEN 과 같은 규칙). 공유 토큰으로 /share-links 는 볼 수 없다(403).
        - 프론트 링크 모양: `<origin>/share#<token>` — 토큰은 URL 조각(#)에만 둬 서버 로그·Referer 로 새지 않는다.
        - status: active(유효) / expired(만료) / revoked(회수) — 조회 시각 기준 서버 계산.
      type: object
      additionalProperties: false
      required:
      - id
      - label
      - created_at
      - expires_at
      - revoked_at
      - status
      properties:
        id:
          type: integer
        label:
          description: 누구에게 줬는지 메모(역할·용도만, 사람 이름 금지)
          type:
          - string
          - 'null'
          maxLength: 64
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        revoked_at:
          type:
          - string
          - 'null'
          format: date-time
        status:
          type: string
          enum:
          - active
          - expired
          - revoked
      examples:
      - id: 3
        label: 가족 공유
        created_at: '2026-10-09T10:00:00+09:00'
        expires_at: '2026-11-08T10:00:00+09:00'
        revoked_at: null
        status: active
    ShareLinkCreate:
      title: ShareLinkCreate
      description: POST /share-links 본문. 만료 기간은 서버 설정(SHARE_TOKEN_TTL_DAYS, 기본 30일)으로만 정한다 — 요청으로 늘릴 수 없다.
      type: object
      additionalProperties: false
      properties:
        label:
          type:
          - string
          - 'null'
          maxLength: 64
    ShareLinkCreated:
      title: ShareLinkCreated
      description: POST /share-links 201 — 발급한 링크와 토큰(이 응답에서 한 번만). 프론트는 `<origin>/share#<token>` 을 보여 준다.
      type: object
      additionalProperties: false
      required:
      - link
      - token
      properties:
        link:
          $ref: '#/components/schemas/ShareLink'
        token:
          type: string
          minLength: 32
          maxLength: 128
    Snapshot:
      title: Snapshot
      description: |-
        기준일 스냅샷 리비전 = 하루치 수집·판정·점수의 불변 묶음 (RA §3, ADR-8, DECISIONS D11-1). (region_id, asof_date, revision) 유일(계약 2026-10-09.8). 발행(published) 리비전은 불변 — 발행 후 재판정(사람 확인·생활권 편집·판정기 버전 변경·시나리오 실행·지역 확장·같은 기준일 재수집)은 같은 기준일의 새 리비전(revision+1, revision_of = 바탕 리비전)에 쓰고 완성된 뒤 한 번에 published 가 된다. 화면 기본 = 최신 published 리비전, ?snapshot= 은 리비전 스냅샷 id. **계약 2026-10-09.10(D13-1)**: 발행 리비전의 화면 응답·CSV·보고서는 발행 순간 저장한 읽기 모델(snapshot_view)을 그대로 돌려준다 — 이후 사실·강등·사람 확인·생활권·호재·지역 이름이 바뀌어도 그 리비전 응답 바이트는 같다. 발행 전(building·ready) 리비전만 지금 사실로 계산한다. 리비전 사이 diff(보고서 diff 표)가 RA §10 '판정기 버전 변경 → 이전 run 과 delta 표'와 '지역 추가 장'을 겸한다.
        status: building(수집·판정 중) → ready(점수까지 계산됨) → published(claim contradicted 0 검사 통과). contradicted_claims > 0 이면 published가 될 수 없고 보고서 생성 버튼은 비활성(G8).
        degraded=true: 이 스냅샷을 만드는 동안 판정기가 없었다(JudgeUnavailable) — 수집·정규화만 있고 점수는 미계산(T18). 화면 G1·G7 배너.
      type: object
      additionalProperties: false
      required:
      - id
      - region_id
      - asof_date
      - status
      - degraded
      - created_at
      properties:
        id:
          type: integer
        region_id:
          type: integer
        asof_date:
          type: string
          format: date
        revision:
          x-nonfact: 버전 번호(같은 기준일 리비전)
          description: 같은 기준일 리비전 번호(1부터, 계약 2026-10-09.8 — D11-1). 서버 응답에는 늘 실린다(스키마 기본 1 — 옛 입력·픽스처 호환)
          type: integer
          minimum: 1
          default: 1
        revision_of:
          x-nonfact: 스냅샷 식별자(바탕 리비전 id)
          description: 비교 기준 리비전 id — 같은 기준일 새 리비전이면 그 바탕 발행 리비전, 비교 기준이 없는 미발행 리비전 1(지역 확장·판정기 버전 변경 — 계약 .9 S9)이면 직전 발행 스냅샷. 그 밖의 리비전 1 은 null. 보고서 기본 비교(§12·delta 표)가 이 값을 쓴다
          type:
          - integer
          - 'null'
        revision_reason:
          description: 리비전을 만든 사유(사람 확인·생활권 편집·판정기 버전 변경·시나리오 실행·지역 확장·같은 기준일 재수집 등). 리비전 1 은 null
          type:
          - string
          - 'null'
          maxLength: 200
        status:
          type: string
          enum:
          - building
          - ready
          - published
        degraded:
          type: boolean
        created_at:
          type: string
          format: date-time
        published_at:
          type:
          - string
          - 'null'
          format: date-time
        contradicted_claims:
          x-nonfact: 집계 개수(행 수 메타 — 출처 데이터 아님)
          description: 남은 contradicted 주장 수 = 분할 재검증 자식이 없는 contradicted(judge.claims.remaining_contradicted — publish·보고서 생성을 막는 수, 계약 2026-10-09.4에서 분할된 주장은 빼고 세도록 명시)
          type:
          - integer
          - 'null'
          minimum: 0
        complex_count:
          x-nonfact: 집계 개수(행 수 메타 — 출처 데이터 아님)
          type:
          - integer
          - 'null'
          minimum: 0
        backfilled_at:
          x-nonfact: 저장본 메타(시각)
          description: '계약 .14(D17-2): 업그레이드 backfill 이 이 발행 리비전 저장본에 **새로 계산해 채운** 값(발행 순간 값이 아니라 업그레이드 때 그때 사실로 계산 — 빠진 단지 상세·시나리오·출처 서랍 등)이 있으면 그 시각(가장 늦은 것, KST ISO). 화면은 ''업그레이드 때 다시 계산한 값 포함'' 안내를 둔다. 발행이 쓴 저장본만 있으면 키가 없다(발행 리비전 응답의 이 객체 바이트 그대로)'
          type:
          - string
          - 'null'
      examples:
      - id: 12
        region_id: 1
        asof_date: '2026-10-08'
        revision: 1
        revision_of: null
        revision_reason: null
        status: published
        degraded: false
        created_at: '2026-10-08T06:00:03+09:00'
        published_at: '2026-10-08T07:42:10+09:00'
        contradicted_claims: 0
        complex_count: 16
    SnapshotPublishPayload:
      title: SnapshotPublishPayload
      description: |-
        job_name='snapshot.publish' 페이로드 (RA §4-4). 재판정 완료 후 자동 등록. worker가 claim.verify_status=contradicted 0건을 확인한 뒤에만 snapshot.status를 published로 바꾼다. 남아 있으면 잡은 failed, error_text에 개수.
        계약 2026-10-09.11(D14-5): 발행(저장본 materialize)은 **이 잡에서만** 한다 — 계산(쓰기 잠금 없음) → 저장본 나눠 쓰기 → 짧은 published 전환. 끝날 때까지 이전 발행 리비전이 기본이다. 계약 .12(D15-6): 리비전마다 발행은 하나만 돈다(single-flight — 아무것도 지우지 않는다). 계약 .13(D16-3): 같은 리비전을 다른 발행이 들고 있으면 실패가 아니라 **지연 재큐잉** — status 가 다시 queued, stats.requeue_count(누적)·stats.not_before(이 시각 전에는 worker 가 집지 않는다, 2·4·8·16·30초…)·stats.requeue_reason('publish_in_progress: …'), error_text 없음. 40회를 넘으면 failed error_text 'publish_in_progress: …'. 잡 stats = {published, contradicted, rows, bytes, missing_provenance(출처 누락 '확인 불가' 건수, D14-8), write_max_lock_s, total_s, …}.
        carry_from_snapshot_id(선택): 판정 없이 바뀌는 리비전 값(호재 연결 PATCH)용 — 그 발행 리비전의 파생 행(판정·점수)을 이 리비전에 복사한 뒤 발행한다.
      type: object
      additionalProperties: false
      required:
      - snapshot_id
      properties:
        snapshot_id:
          type: integer
        carry_from_snapshot_id:
          type:
          - integer
          - 'null'
          description: '계약 .11: 파생 행을 복사할 바탕 발행 리비전(호재 연결 변경 — 판정기 호출 없음)'
        follow_up:
          type: boolean
          description: '계약 .12(D15-6, R3 7차 M5): 후속 발행 잡 — 판정 중·발행 계산 중인 리비전(snapshot_id)에 판정 무관 쓰기(호재 연결)가 들어왔다. 그 리비전의 발행 계산이 이 잡을 읽었으면 전환 트랜잭션이 이 잡을 done(stats.included_in_snapshot_id)으로 닫고, 못 읽었으면 이 잡이 돌아 지역의 가장 새 발행 리비전 위 새 리비전(파생 행 복사)을 발행하거나, 발행 대기(ready) 리비전을 지금 발행하거나, 판정 중이면 미룬다(stats.deferred_to).'
      examples:
      - snapshot_id: 12
      - snapshot_id: 14
        carry_from_snapshot_id: 12
      - snapshot_id: 14
        follow_up: true
    SourceKind:
      title: SourceKind
      description: 원문 출처 종류 (RA §3 + DECISIONS D2-1 reference)
      type: string

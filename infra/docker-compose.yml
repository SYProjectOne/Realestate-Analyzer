# subscription-analyzer — 단일 호스트 배포 (RA §10, ADR-10)
#   cp infra/.env.example infra/.env   # 값 채우기 (커밋 금지)
#   docker compose -f infra/docker-compose.yml up -d --build
# 서비스 4개(db·api·worker·web), 볼륨 2개(pgdata·rawdata).

name: subscription-analyzer

x-backend-env: &backend-env
  ENV: ${ENV:-prod}
  TZ: Asia/Seoul
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-sa}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 를 infra/.env 에 설정}@db:5432/${POSTGRES_DB:-subscription}
  RAW_DIR: /data/raw
  REFERENCE_DIR: /data/reference
  REPORT_DIR: /data/reports

x-env-file: &env-file
  - path: .env
    required: false

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 를 infra/.env 에 설정}
      POSTGRES_DB: ${POSTGRES_DB:-subscription}
      TZ: Asia/Seoul
    volumes:
      - pgdata:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    restart: unless-stopped
    env_file: *env-file
    environment: *backend-env
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - rawdata:/data:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile.worker
    restart: unless-stopped
    env_file: *env-file
    environment: *backend-env
    volumes:
      - rawdata:/data
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy  # api 가 마이그레이션을 끝낸 뒤 시작

  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:8080"
    depends_on:
      - api

volumes:
  pgdata:
  rawdata:

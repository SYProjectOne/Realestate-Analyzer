# web 컨테이너 nginx 설정 (Dockerfile.web → /etc/nginx/conf.d/default.conf)
# - 정적 번들(SPA): 없는 경로는 index.html 로 (React Router)
# - /api/* → api:8000 경로 그대로(접두 /api 유지; FastAPI 가 API_PREFIX=/api 아래에 라우터를 붙인다)

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20m;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;  # 보고서 PDF 다운로드 등
    }

    location = /health {
        proxy_pass http://api:8000/health;
    }

    location /assets/ {
        expires 30d;  # add_header 를 쓰면 server 수준 보안 헤더 상속이 끊긴다
        try_files $uri =404;
    }

    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
